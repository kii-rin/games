<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6cfdd" />
  <title>Squish Dumpling</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6cfdd}
    #gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6cfdd}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font:800 14px system-ui,-apple-system,sans-serif;color:#76505f;background:linear-gradient(#f9d9e6,#efb5cc);z-index:2;transition:opacity .18s ease}
    #loading.hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="loading">loading mochi…</div>
  <iframe id="gameFrame" title="Squish Dumpling" allow="fullscreen"></iframe>
  <script>
  (async()=>{
    const frame=document.getElementById('gameFrame');
    const loading=document.getElementById('loading');
    try{
      let source=await fetch('./game-core.html?v=mobile-20260902',{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error('Could not load game core');
        return r.text();
      });

      const mobileCss=`
<style id="mobile-responsive-patch">
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
.status{left:max(18px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top))}
.meter{right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top))}
@media (max-width:1024px),(pointer:coarse) and (max-width:1180px){
  .dresser{left:max(10px,env(safe-area-inset-left));padding:6px;gap:5px;border-radius:19px}
  .dresser button{width:54px;height:54px;min-height:54px;display:grid;grid-template-columns:1fr;place-items:center;padding:5px;border-radius:15px}
  .tool-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .icon-wrap{width:42px;height:42px}
  .finger{width:clamp(180px,44vw,310px)}
  .meter{display:none}
}
@media (max-width:600px){
  .sim-shell{min-height:0}
  .status{left:max(9px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));min-height:34px;padding:0 10px;font-size:11px}
  .dresser{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:auto;bottom:max(8px,env(safe-area-inset-bottom));transform:none;flex-direction:row;align-items:center;gap:5px;padding:5px;max-width:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .dresser::-webkit-scrollbar{display:none}
  .dresser button{flex:0 0 48px;width:48px;height:48px;min-height:48px;padding:4px;border-radius:14px}
  .icon-wrap{width:38px;height:38px;border-radius:11px}
  .finger{width:clamp(145px,47vw,235px)}
}
@media (max-height:500px) and (pointer:coarse){
  .status{min-height:30px;font-size:10px}
  .dresser button{flex-basis:42px;width:42px;height:42px;min-height:42px}
  .icon-wrap{width:34px;height:34px}
  .finger{width:clamp(130px,34vw,210px)}
}
</style>`;
      source=source.replace('</head>',mobileCss+'\n</head>');

      source=source.replace(
        "const camera = new THREE.PerspectiveCamera(33, 1, 0.05, 50);\n    camera.position.set(0, 0.03, 6.05);",
        "const BASE_CAMERA_Z = 6.05;\n    const camera = new THREE.PerspectiveCamera(33, 1, 0.05, 50);\n    camera.position.set(0, 0.03, BASE_CAMERA_Z);"
      );

      source=source.replace(
        "renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));",
        `const coarsePointer = window.matchMedia?.('(pointer: coarse)').matches ?? false;
    function preferredPixelRatio() {
      const shortEdge = Math.min(window.innerWidth || 9999, window.innerHeight || 9999);
      const cap = coarsePointer ? (shortEdge <= 600 ? 1.25 : 1.45) : 1.65;
      return Math.min(window.devicePixelRatio || 1, cap);
    }
    renderer.setPixelRatio(preferredPixelRatio());`
      );

      source=source.replace(
        "const geometry = new THREE.SphereGeometry(1.38, 112, 84);",
        `const meshShortEdge = Math.min(window.innerWidth || 9999, window.innerHeight || 9999);
    const meshW = coarsePointer && meshShortEdge <= 600 ? 96 : coarsePointer && meshShortEdge <= 900 ? 104 : 112;
    const meshH = coarsePointer && meshShortEdge <= 600 ? 72 : coarsePointer && meshShortEdge <= 900 ? 78 : 84;
    const geometry = new THREE.SphereGeometry(1.38, meshW, meshH);`
      );

      source=source.replace(
`    function resize() {
      const w = Math.max(1, host.clientWidth);
      const h = Math.max(420, host.clientHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(host);
    resize();`,
`    function resize() {
      const w = Math.max(1, host.clientWidth);
      const h = Math.max(1, host.clientHeight);
      const aspect = w / h;
      camera.aspect = aspect;

      let framing = 1;
      if (aspect < 0.92) framing = clamp(0.92 / aspect, 1, 1.95);
      if (coarsePointer && h < 500) framing = Math.max(framing, 1.14);
      camera.position.z = BASE_CAMERA_Z * framing;
      camera.position.y = (coarsePointer && w <= 600 && h > w) ? -0.08 : 0.03;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(preferredPixelRatio());
      renderer.setSize(w, h, false);
    }

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(host);
    window.visualViewport?.addEventListener('resize', resize, { passive: true });
    window.addEventListener('orientationchange', () => requestAnimationFrame(resize), { passive: true });
    resize();`
      );

      frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),80),{once:true});
      frame.srcdoc=source;
    }catch(err){
      console.error(err);
      loading.textContent='Could not load Mochi. Please refresh.';
    }
  })();
  </script>
</body>
</html>
