<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6cfdd" />
  <title>Squish Dumpling</title>
  <style>
    :root { font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#4d3540; background:#f6cfdd; font-synthesis:none; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; min-width:320px; overflow:hidden; }
    button, input { font:inherit; }
    #bootError { display:none; position:absolute; z-index:100; inset:20px auto auto 50%; transform:translateX(-50%); max-width:min(560px,calc(100% - 40px)); padding:12px 16px; border-radius:14px; background:#fff5f8; color:#7b3d55; box-shadow:0 10px 30px rgba(80,40,55,.12); font-weight:700; text-align:center; }

  .sim-shell {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 420px;
    overflow: hidden;
    background:
      radial-gradient(circle at 53% 31%, rgba(255,255,255,.88), rgba(255,255,255,0) 46%),
      linear-gradient(#f9d9e6, #efb5cc);
    color: #4d3540;
    user-select: none;
  }

  .stage { position: absolute; inset: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; }

  .finger {
    position: absolute;
    z-index: 20;
    width: clamp(230px, 39%, 430px);
    max-width: none;
    transform:
      translate(-10%, -49%)
      translateX(calc(var(--press, 0) * -18px))
      scale(calc(.95 + var(--press, 0) * .035));
    transform-origin: 12% 50%;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 12px 16px rgba(115, 64, 72, .13));
    transition: opacity .10s ease;
  }
  .finger.shown { opacity: 1; }

  .hud {
    position: absolute;
    top: 16px;
    z-index: 24;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid rgba(91,59,70,.10);
    border-radius: 999px;
    background: rgba(255,250,252,.78);
    backdrop-filter: blur(12px);
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 8px 22px rgba(91,59,70,.07);
    pointer-events: none;
  }
  .status { left: 18px; }
  .meter { right: 18px; }
  .meter-label { color: #987b86; font-weight: 700; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #c7b7bd; }
  .status-dot.live { background: #f2779d; box-shadow: 0 0 0 4px rgba(242,119,157,.15); }
  .divider { width: 1px; height: 13px; background: rgba(91,59,70,.15); }

  .dresser {
    position: absolute;
    z-index: 25;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 8px;
    border: 1px solid rgba(100,56,72,.09);
    border-radius: 23px;
    background: rgba(255,248,251,.70);
    backdrop-filter: blur(14px);
    box-shadow: 0 14px 32px rgba(91,59,70,.09);
  }

  .dresser button {
    width: 154px;
    min-height: 54px;
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    align-items: center;
    gap: 9px;
    border: 1px solid transparent;
    border-radius: 16px;
    padding: 5px 9px 5px 6px;
    background: transparent;
    color: #6d3c4f;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    text-align: left;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease, transform .14s ease;
  }

  .dresser button:hover { background: rgba(255,255,255,.56); }
  .dresser button.active-choice {
    background: rgba(242,128,169,.18);
    border-color: rgba(235,100,148,.26);
    color: #a84268;
  }
  .dresser button:focus-visible {
    outline: 3px solid rgba(234,95,145,.32);
    outline-offset: 2px;
  }

  .icon-wrap {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 13px;
    background: rgba(255,255,255,.82);
    box-shadow: inset 0 0 0 1px rgba(106,64,77,.07);
    color: #d86d96;
  }
  .icon-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .icon-wrap svg { width: 27px; height: 27px; }
  .tool-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }


  @media (max-width: 760px) {
    .sim-shell { min-height: 560px; }
    .dresser {
      left: 10px;
      padding: 6px;
      gap: 5px;
      border-radius: 19px;
    }
    .dresser button {
      width: 54px;
      height: 54px;
      min-height: 54px;
      display: grid;
      grid-template-columns: 1fr;
      place-items: center;
      padding: 5px;
      border-radius: 15px;
    }
    .tool-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .icon-wrap { width: 42px; height: 42px; }
    .finger { width: clamp(220px, 64%, 390px); }
    .meter { display: none; }
  }

  @media (max-width: 460px) {
    .status { left: 10px; top: 10px; }
    .dresser { top: 52%; }
  }

  </style>
</head>
<body>
  <div class="sim-shell" id="game">
    <div id="stage" class="stage" aria-label="Interactive soft dumpling. Press and drag anywhere on the dumpling to deform it."></div>
    <img id="finger" class="finger" alt="" aria-hidden="true" />

    <div class="hud status" aria-live="polite">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">mochi loading</span>
    </div>

    <div class="hud meter" aria-live="polite">
      <span id="pressureValue">0%</span>
      <span class="meter-label">squish</span>
      <span class="divider"></span>
      <span id="fpsValue">-- fps</span>
    </div>

    <nav id="dresser" class="dresser" aria-label="Dumpling accessories"></nav>
    <div id="bootError" role="alert"></div>
  </div>

    const tmpPos = new THREE.Vector3();
    const tmpNormal = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const tmpUp = new THREE.Vector3();
    const basisMatrix = new THREE.Matrix4();
    const zAxis = new THREE.Vector3(0, 0, 1);
    const worldUp = new THREE.Vector3(0, 1, 0);
    const fallbackUp = new THREE.Vector3(1, 0, 0);
    const targetQuat = new THREE.Quaternion();
    const displayNormal = new THREE.Vector3();

    function sampleAnchor(anchor, outPos, outNormal) {
      outPos.set(0, 0, 0);
      outNormal.set(0, 0, 0);
      const normals = geometry.attributes.normal.array;
      for (const e of anchor) {
        const j = e.i * 3;
        outPos.x += position.array[j] * e.w;
        outPos.y += position.array[j + 1] * e.w;
        outPos.z += position.array[j + 2] * e.w;
        outNormal.x += normals[j] * e.w;
        outNormal.y += normals[j + 1] * e.w;
        outNormal.z += normals[j + 2] * e.w;
      }
      outNormal.normalize();
    }

    function uprightQuaternion(normal, outQuaternion) {
      tmpUp.copy(worldUp).addScaledVector(normal, -worldUp.dot(normal));
      if (tmpUp.lengthSq() < 0.001) {
        tmpUp.copy(fallbackUp).addScaledVector(normal, -fallbackUp.dot(normal));
      }
      tmpUp.normalize();
      tmpRight.crossVectors(tmpUp, normal).normalize();
      tmpUp.crossVectors(normal, tmpRight).normalize();
      basisMatrix.makeBasis(tmpRight, tmpUp, normal);
      outQuaternion.setFromRotationMatrix(basisMatrix);
    }

    // ---------- face ----------
    const eyeMat = new THREE.MeshPhysicalMaterial({
      color: 0x241710,
      roughness: 0.16,
      clearcoat: 0.82,
      clearcoatRoughness: 0.16,
      depthTest: false,
      depthWrite: false
    });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, depthTest: false, depthWrite: false });
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x6d342f, toneMapped: false, depthTest: false, depthWrite: false });

    const faceAttachments = [];
    function createEye(x) {
      const holder = new THREE.Group();
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.145, 36, 28), eyeMat);
      eye.scale.set(0.78, 1.12, 0.34);
      eye.position.z = 0.035;
      eye.renderOrder = 8;
      holder.add(eye);

      const shine = new THREE.Mesh(new THREE.SphereGeometry(0.037, 18, 14), whiteMat);
      shine.position.set(-0.035, 0.05, 0.085);
      shine.renderOrder = 9;
      holder.add(shine);
      scene.add(holder);

      faceAttachments.push({
        holder,
        anchor: makeSurfaceAnchor(new THREE.Vector3(x, -0.05, 1.34), 22),
        offset: 0.055,
        normalBlend: 0.9
      });
      return eye;
    }

    const leftEye = createEye(-0.36);
    const rightEye = createEye(0.36);

    const mouthHolder = new THREE.Group();
    const mouthCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.12, 0.02, 0.02),
      new THREE.Vector3(0, -0.05, 0.025),
      new THREE.Vector3(0.12, 0.02, 0.02)
    ]);
    const mouth = new THREE.Mesh(new THREE.TubeGeometry(mouthCurve, 24, 0.021, 10, false), mouthMat);
    mouth.renderOrder = 8;
    mouthHolder.add(mouth);
    scene.add(mouthHolder);
    faceAttachments.push({
      holder: mouthHolder,
      anchor: makeSurfaceAnchor(new THREE.Vector3(0, -0.34, 1.34), 22),
      offset: 0.05,
      normalBlend: 0.9
    });

    function updateFaceSurface() {
      for (const item of faceAttachments) {
        sampleAnchor(item.anchor, tmpPos, tmpNormal);
        displayNormal.copy(zAxis).lerp(tmpNormal, item.normalBlend).normalize();
        uprightQuaternion(displayNormal, targetQuat);
        item.holder.position.copy(tmpPos).addScaledVector(tmpNormal, item.offset);
        item.holder.quaternion.copy(targetQuat);
      }
    }

    // ---------- physically attached accessory planes ----------
    // Lashes and blush are separate left/right pieces. A single wide image can never sit correctly
    // on a curved/deforming face, so each piece gets its own surface anchor beside its matching eye.
    const accessoryObjects = new Map();
    const textureLoader = new THREE.TextureLoader();

    const accessorySpecs = [
      {
        id: 'bow-glossy',
        parts: [
          { src: ASSETS['bow-glossy.png'], anchor: new THREE.Vector3(0, 0.82, 1.08), width: 1.36, height: 1.36, offset: 0.10, normalBlend: 0.42 }
        ]
      },
      {
        id: 'bow-satin',
        parts: [
          { src: ASSETS['bow-satin.png'], anchor: new THREE.Vector3(0, 0.84, 1.06), width: 1.40, height: 1.40, offset: 0.10, normalBlend: 0.42 }
        ]
      },
      {
        id: 'flower',
        parts: [
          { src: ASSETS['flower-clip.png'], anchor: new THREE.Vector3(0.72, 0.53, 1.02), width: 0.80, height: 0.80, offset: 0.10, normalBlend: 0.50, rotation: -0.08 }
        ]
      },
      {
        id: 'lashes',
        parts: [
          // Smaller and spaced slightly outward so each lash hugs its own eye instead of crossing the face.
          { src: ASSETS['lash-left.png'], anchor: new THREE.Vector3(-0.39, 0.115, 1.335), width: 0.34, height: 0.205, offset: 0.068, normalBlend: 0.82, rotation: -0.055, skinLocked: true },
          { src: ASSETS['lash-right.png'], anchor: new THREE.Vector3(0.39, 0.115, 1.335), width: 0.34, height: 0.205, offset: 0.068, normalBlend: 0.82, rotation: 0.055, skinLocked: true }
        ]
      },
      {
        id: 'blush',
        parts: [
          // Procedural feathered cheek tint: no glossy sticker highlight, no independent rotation.
          { kind: 'blush', anchor: new THREE.Vector3(-0.54, -0.235, 1.285), width: 0.34, height: 0.19, offset: 0.044, normalBlend: 0.56, opacity: 0.34, skinLocked: true },
          { kind: 'blush', anchor: new THREE.Vector3(0.54, -0.235, 1.285), width: 0.34, height: 0.19, offset: 0.044, normalBlend: 0.56, opacity: 0.34, skinLocked: true }
        ]
      },
      {
        id: 'sparkles',
        parts: [
          { src: ASSETS['sparkles.png'], anchor: new THREE.Vector3(0.67, 0.56, 1.03), width: 1.12, height: 1.12, offset: 0.14, normalBlend: 0.30 }
        ]
      }
    ];

    function makeBlushTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 4, 64, 64, 60);
      gradient.addColorStop(0, 'rgba(255,112,145,0.95)');
      gradient.addColorStop(0.48, 'rgba(255,126,154,0.62)');
      gradient.addColorStop(1, 'rgba(255,150,170,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      return texture;
    }

    const blushTexture = makeBlushTexture();

    function createAccessoryPart(spec) {
      const texture = spec.kind === 'blush' ? blushTexture : textureLoader.load(spec.src);
      texture.colorSpace = THREE.SRGBColorSpace;
      if (spec.kind !== 'blush') {
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      }

      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: spec.opacity ?? 1,
        depthWrite: false,
        depthTest: false,
        alphaTest: spec.kind === 'blush' ? 0 : 0.015,
        toneMapped: false,
        side: THREE.DoubleSide,
        blending: spec.kind === 'blush' ? THREE.NormalBlending : THREE.NormalBlending
      });

      const visual = new THREE.Mesh(
        new THREE.PlaneGeometry(spec.width, spec.height),
        mat
      );
      visual.renderOrder = 7;
      visual.rotation.z = spec.rotation || 0;

      const holder = new THREE.Group();
      holder.add(visual);
      scene.add(holder);

      const anchor = makeSurfaceAnchor(spec.anchor, spec.skinLocked ? 18 : 24);
      sampleAnchor(anchor, tmpPos, tmpNormal);
      displayNormal.copy(zAxis).lerp(tmpNormal, spec.normalBlend).normalize();
      uprightQuaternion(displayNormal, targetQuat);
      const initialPos = tmpPos.clone().addScaledVector(tmpNormal, spec.offset);
      holder.position.copy(initialPos);
      holder.quaternion.copy(targetQuat);

      return {
        ...spec,
        texture,
        material: mat,
        visual,
        holder,
        anchor,
        pos: initialPos.clone(),
        vel: new THREE.Vector3(),
        quat: targetQuat.clone(),
        baseRotation: spec.rotation || 0,
        tilt: 0
      };
    }

    for (const spec of accessorySpecs) {
      accessoryObjects.set(spec.id, spec.parts.map(createAccessoryPart));
    }

    function updateAccessorySurface(dt) {
      for (const [id, parts] of accessoryObjects) {
        const visible = accessory === id;
        for (const item of parts) {
          item.holder.visible = visible;
          if (!visible) continue;

          sampleAnchor(item.anchor, tmpPos, tmpNormal);
          displayNormal.copy(zAxis).lerp(tmpNormal, item.normalBlend).normalize();
          tmpPos.addScaledVector(tmpNormal, item.offset);
          uprightQuaternion(displayNormal, targetQuat);

          if (item.skinLocked) {
            // Face makeup is effectively painted onto the skin: no lag and no pendulum-like tilt.
            item.pos.copy(tmpPos);
            item.vel.set(0, 0, 0);
            item.holder.position.copy(tmpPos);
            item.quat.copy(targetQuat);
            item.holder.quaternion.copy(targetQuat);
            item.visual.rotation.z = item.baseRotation;
          } else {
            // Hair accessories retain a little secondary motion.
            const spring = 78;
            const damping = 12.4;
            tmpRight.copy(tmpPos).sub(item.pos);
            item.vel.addScaledVector(tmpRight, spring * dt);
            item.vel.multiplyScalar(Math.exp(-damping * dt));
            item.pos.addScaledVector(item.vel, dt);
            item.holder.position.copy(item.pos);
            item.quat.slerp(targetQuat, 1 - Math.exp(-16 * dt));
            item.holder.quaternion.copy(item.quat);
            item.tilt += (clamp(-item.vel.x * 0.12, -0.08, 0.08) - item.tilt) * (1 - Math.exp(-11 * dt));
            item.visual.rotation.z = item.baseRotation + item.tilt;
          }
        }
      }
    }

    // ---------- lighting / floor ----------
    scene.add(new THREE.HemisphereLight(0xfffbf7, 0x725967, 2.3));
    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(-3.6, 4.8, 4.5);
    key.castShadow = false;
    scene.add(key);

    const fill = new THREE.PointLight(0xffa9c6, 13, 8, 2);
    fill.position.set(3.0, 1.7, 2.2);
    scene.add(fill);

    const rim = new THREE.PointLight(0xfff2cf, 9, 7, 2);
    rim.position.set(-2.3, -0.8, 2.4);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(3.1, 72),
      new THREE.MeshStandardMaterial({ color: 0xf3bfd1, roughness: 0.88 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.43;
    floor.receiveShadow = false;
    scene.add(floor);

    const fakeShadow = new THREE.Mesh(
      new THREE.CircleGeometry(1, 64),
      new THREE.MeshBasicMaterial({ color: 0x8f6473, transparent: true, opacity: 0.14, depthWrite: false })
    );
    fakeShadow.scale.set(1.38, 0.48, 1);
    fakeShadow.rotation.x = -Math.PI / 2;
    fakeShadow.position.set(0.10, -1.405, 0.08);
    scene.add(fakeShadow);

    // ---------- touch ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const localPoint = new THREE.Vector3();
    const localNormal = new THREE.Vector3();

    const contact = {
      down: false,
      pointerId: null,
      point: new THREE.Vector3(),
      normal: new THREE.Vector3(0, 0, 1),
      targetDepth: 0,
      depth: 0,
      radius: 0.49,
      pressureInput: 0.62
    };

    function sampleContact(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = clamp(event.clientX - rect.left, 0, rect.width);
      const cy = clamp(event.clientY - rect.top, 0, rect.height);
      pointer.x = (cx / rect.width) * 2 - 1;
      pointer.y = -(cy / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(dumpling, false)[0];
      if (!hit) return false;

      localPoint.copy(hit.point);
      dumpling.worldToLocal(localPoint);
      localNormal.copy(hit.face.normal).normalize();
      contact.point.copy(localPoint);
      contact.normal.copy(localNormal);
      contact.pressureInput = event.pressure > 0 ? clamp(event.pressure, 0.25, 1) : 0.64;
      contact.targetDepth = 0.23 + contact.pressureInput * 0.18;

      fingerX = cx;
      fingerY = cy;
      active = true;
      return true;
    }

    function pointerDown(event) {
      if (contact.down || !sampleContact(event)) return;
      contact.down = true;
      contact.pointerId = event.pointerId;
      fingerVisible = true;
      renderer.domElement.setPointerCapture?.(event.pointerId);
    }

    function pointerMove(event) {
      if (!contact.down || event.pointerId !== contact.pointerId) return;
      sampleContact(event);
    }

    function pointerUp(event) {
      if (event.pointerId !== contact.pointerId) return;
      contact.down = false;
      contact.pointerId = null;
      contact.targetDepth = 0;
      active = false;
      fingerVisible = false;
      renderer.domElement.releasePointerCapture?.(event.pointerId);
    }

    renderer.domElement.addEventListener('pointerdown', pointerDown);
    renderer.domElement.addEventListener('pointermove', pointerMove);
    renderer.domElement.addEventListener('pointerup', pointerUp);
    renderer.domElement.addEventListener('pointercancel', pointerUp);

    let lastTime = performance.now();
    let frameCounter = 0;
    let fpsWindow = lastTime;
    let raf = 0;
    let normalFrame = 0;
    let blinkClock = 0;

    function simulate(dt) {
      const memoryK = 20.0;
      const edgeK = 70.0;
      const damping = 5.5;
      const contactK = 116.0;
      const bulgeK = 0.34;
      const volumeK = 24.0;
      const maxSpeed = 4.0;

      contact.depth += (contact.targetDepth - contact.depth) * (1 - Math.exp(-21 * dt));
      pressure = clamp(contact.depth / 0.41, 0, 1);
      force.fill(0);
      let radialError = 0;

      for (let i = 0; i < count; i++) {
        const j = i * 3;
        force[j] += (rest[j] - position.array[j]) * memoryK - velocity[j] * damping;
        force[j + 1] += (rest[j + 1] - position.array[j + 1]) * memoryK - velocity[j + 1] * damping;
        force[j + 2] += (rest[j + 2] - position.array[j + 2]) * memoryK - velocity[j + 2] * damping;
        radialError += Math.hypot(rest[j], rest[j + 1], rest[j + 2]) - Math.hypot(position.array[j], position.array[j + 1], position.array[j + 2]);
      }

      // Process alternating edge sets each substep. The body still has full rest-position springs,
      // so this halves the heaviest CPU loop without producing visible seams.
      const edgeParity = normalFrame & 1;
      for (let e = edgeParity; e < edgeCount; e += 2) {
        const a = edgeA[e], b = edgeB[e], restLen = edgeRest[e];
        const ai = a * 3, bi = b * 3;
        let dx = position.array[bi] - position.array[ai];
        let dy = position.array[bi + 1] - position.array[ai + 1];
        let dz = position.array[bi + 2] - position.array[ai + 2];
        const len = Math.hypot(dx, dy, dz) || 1e-6;
        const f = (len - restLen) * edgeK;
        dx /= len; dy /= len; dz /= len;
        force[ai] += dx * f; force[ai + 1] += dy * f; force[ai + 2] += dz * f;
        force[bi] -= dx * f; force[bi + 1] -= dy * f; force[bi + 2] -= dz * f;
      }

      if (contact.depth > 0.001) {
        const r = contact.radius;
        const r2 = r * r;
        for (let i = 0; i < count; i++) {
          const j = i * 3;
          const dx = rest[j] - contact.point.x;
          const dy = rest[j + 1] - contact.point.y;
          const dz = rest[j + 2] - contact.point.z;
          const dist2 = dx * dx + dy * dy + dz * dz;
          if (dist2 > r2 * 4.5) continue;
          const dist = Math.sqrt(dist2);
          const centerWeight = Math.exp(-dist2 / (r2 * 0.66));
          const inward = contact.depth * contactK * centerWeight;
          force[j] -= contact.normal.x * inward;
          force[j + 1] -= contact.normal.y * inward;
          force[j + 2] -= contact.normal.z * inward;

          const axial = dx * contact.normal.x + dy * contact.normal.y + dz * contact.normal.z;
          let tx = dx - contact.normal.x * axial;
          let ty = dy - contact.normal.y * axial;
          let tz = dz - contact.normal.z * axial;
          const tangentLen = Math.hypot(tx, ty, tz) || 1;
          tx /= tangentLen; ty /= tangentLen; tz /= tangentLen;
          const ringCenter = r * 0.72;
          const ring = Math.exp(-Math.pow(dist - ringCenter, 2) / (r2 * 0.105));
          const bulge = contact.depth * contactK * bulgeK * ring;
          force[j] += tx * bulge;
          force[j + 1] += ty * bulge;
          force[j + 2] += tz * bulge;
        }
      }

      radialError = clamp(radialError / count, -0.05, 0.05);

      for (let i = 0; i < count; i++) {
        const j = i * 3;
        const px = position.array[j], py = position.array[j + 1], pz = position.array[j + 2];
        const pl = Math.hypot(px, py, pz) || 1;
        const vf = radialError * volumeK;
        force[j] += (px / pl) * vf;
        force[j + 1] += (py / pl) * vf;
        force[j + 2] += (pz / pl) * vf;
        velocity[j] = clamp(velocity[j] + force[j] * dt, -maxSpeed, maxSpeed);
        velocity[j + 1] = clamp(velocity[j + 1] + force[j + 1] * dt, -maxSpeed, maxSpeed);
        velocity[j + 2] = clamp(velocity[j + 2] + force[j + 2] * dt, -maxSpeed, maxSpeed);
        position.array[j] += velocity[j] * dt;
        position.array[j + 1] += velocity[j + 1] * dt;
        position.array[j + 2] += velocity[j + 2] * dt;

        // Numerical safety: a soft-body vertex should never travel arbitrarily far from its
        // undeformed location. This prevents one bad frame from launching the whole mesh away.
        let ddx = position.array[j] - rest[j];
        let ddy = position.array[j + 1] - rest[j + 1];
        let ddz = position.array[j + 2] - rest[j + 2];
        let displacement = Math.hypot(ddx, ddy, ddz);
        if (!Number.isFinite(displacement)) {
          position.array[j] = rest[j];
          position.array[j + 1] = rest[j + 1];
          position.array[j + 2] = rest[j + 2];
          velocity[j] = velocity[j + 1] = velocity[j + 2] = 0;
        } else if (displacement > 0.72) {
          const limit = 0.72 / displacement;
          position.array[j] = rest[j] + ddx * limit;
          position.array[j + 1] = rest[j + 1] + ddy * limit;
          position.array[j + 2] = rest[j + 2] + ddz * limit;
          velocity[j] *= 0.35;
          velocity[j + 1] *= 0.35;
          velocity[j + 2] *= 0.35;
        }
      }

      position.needsUpdate = true;
    }

    function resize() {
      const w = Math.max(1, host.clientWidth);
      const h = Math.max(420, host.clientHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(host);
    resize();

    function render(now) {
      raf = requestAnimationFrame(render);
      const dt = Math.min((now - lastTime) / 1000, 1 / 30);
      lastTime = now;

      // One step at normal frame rates, two only after a slower frame. This keeps the soft response
      // stable without doing v5's 2-3 full solver passes every render.
      const steps = dt > 0.0185 ? 2 : 1;
      const stepDt = Math.min(1 / 60, dt / steps);
      for (let i = 0; i < steps; i++) simulate(stepDt);

      normalFrame++;
      if ((normalFrame & 1) === 0) {
        geometry.computeVertexNormals();
        geometry.attributes.normal.needsUpdate = true;
      }

      updateFaceSurface();
      updateAccessorySurface(dt);

      // Gentle blink. Because each eye holder follows the deformed surface, the blink does not sink into it.
      blinkClock += dt;
      const cycle = blinkClock % 4.3;
      const blink = cycle > 3.94 && cycle < 4.10 ? 0.12 : 1;
      leftEye.scale.y = 1.12 * blink;
      rightEye.scale.y = 1.12 * blink;

      renderer.render(scene, camera);
      frameCounter++;
      if (now - fpsWindow >= 500) {
        fps = Math.round((frameCounter * 1000) / (now - fpsWindow));
        frameCounter = 0;
        fpsWindow = now;
      }
      updateUi();
    }

    raf = requestAnimationFrame(render);

    updateFaceSurface();


  updateUi();
} catch (error) {
  console.error(error);
  const box = document.getElementById('bootError');
  box.style.display = 'block';
  box.textContent = 'Could not load the 3D engine. Check your internet connection and reload.';
  document.getElementById('statusText').textContent = 'load failed';
}
  </script>
</body>
