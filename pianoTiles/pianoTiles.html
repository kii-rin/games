<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rainbow Piano Tiles</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff7ad,#ffd6ec 45%,#c8f4ff);color:#20243a;touch-action:none}.app{height:100dvh;display:grid;place-items:center;padding:8px}.board{position:relative;width:min(98vw,640px);height:calc(100dvh - 16px);min-height:540px;overflow:hidden;border-radius:30px;border:6px solid white;background:#f8fbff;box-shadow:0 24px 60px #20243a33;isolation:isolate}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}.lane{border-left:1px solid #20243a16;cursor:pointer;overflow:hidden}.lane:first-child{border-left:0}.lane:nth-child(1){background:#eff6ff}.lane:nth-child(2){background:#fdf2f8}.lane:nth-child(3){background:#f0fdf4}.lane:nth-child(4){background:#fffbeb}.lane.flash{filter:brightness(.92)}.hud{position:absolute;left:9px;right:9px;top:9px;z-index:10;display:grid;gap:6px;padding:8px;border-radius:20px;background:#ffffffdc;backdrop-filter:blur(12px);box-shadow:0 8px 22px #20243a20}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{display:flex;align-items:center;gap:8px}.logo{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899,#fbbf24);font-size:19px}.title{font-size:15px;font-weight:1000}.mode{font-size:16px}.stats{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn,.back,.pick{border:0;border-radius:999px;background:white;color:#20243a;padding:6px 9px;font-size:12px;font-weight:1000;text-decoration:none;box-shadow:0 5px 12px #20243a18}.btn{background:#20243a;color:white}.menu{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.pick{min-width:35px;height:33px;padding:0;font-size:18px;border:2px solid transparent}.pick.active{border-color:#8b5cf6;background:#fff7fd}.tile{position:absolute;width:82%;height:112px;border-radius:23px;display:grid;place-items:center;font-size:35px;color:white;border:4px solid #ffffffdd;box-shadow:0 12px 26px #20243a38;will-change:top,left,width}.tile span{position:absolute;bottom:10px;background:#ffffff44;border-radius:999px;padding:2px 8px;font-size:13px}.c0{background:linear-gradient(135deg,#60a5fa,#2563eb)}.c1{background:linear-gradient(135deg,#f472b6,#db2777)}.c2{background:linear-gradient(135deg,#34d399,#059669)}.c3{background:linear-gradient(135deg,#fbbf24,#f97316)}.hit{animation:pop .22s ease forwards}.miss{animation:fade .25s ease forwards}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:#ffffffbb;padding:22px}.card{width:min(92%,420px);background:white;border-radius:28px;padding:24px;box-shadow:0 24px 55px #20243a25}.big{font-size:48px}.card h2{font-size:29px;margin:6px 0}.card p{color:#667085;line-height:1.45}.start{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);color:white;padding:15px;font-size:18px;font-weight:1000}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.keys div{background:#f8fafc;border:1px solid #e4e7ec;border-radius:14px;padding:8px 0;font-weight:1000}.combo{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-weight:1000;font-size:34px;text-shadow:0 3px 0 white;opacity:0;pointer-events:none;z-index:12}.combo.show{animation:combo .5s ease}.ok{color:#059669}.bad{color:#ef4444}.spark{position:absolute;font-size:23px;pointer-events:none;animation:spark .65s ease forwards;z-index:12}@keyframes pop{to{transform:scale(.74);opacity:0}}@keyframes fade{to{transform:scale(.86);opacity:.16;filter:grayscale(1)}}@keyframes combo{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.1)}}@keyframes spark{0%{opacity:1;transform:scale(.7) translateY(0)}100%{opacity:0;transform:scale(1.4) translateY(-42px)}}@media(max-width:700px){.board{height:calc(100dvh - 12px);border-radius:24px}.title{font-size:14px}.pill,.btn,.back{font-size:11px;padding:6px 8px}.tile{height:102px;font-size:31px}.hud{left:7px;right:7px;top:7px}}</style></head><body><div class="app"><section class="board" id="board"><div class="lanes"><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div></div><div class="hud"><div class="top"><div class="brand"><div class="logo">🎹</div><div><div class="title">Rainbow Piano Tiles</div><div class="mode" id="mode">🎤</div></div></div><div class="stats"><span class="pill">Score <span id="score">0</span></span><span class="pill">Best <span id="best">0</span></span><a class="back" href="../index.html">Back</a><button class="btn" id="restart">Restart</button></div></div><div class="menu" id="menu"></div></div><div class="combo" id="combo">+1</div><div class="overlay" id="overlay"><div class="card"><div class="big">🌈🎵</div><h2>Ready?</h2><p>Choose an emoji music mode. Tap the whole lane whenever a colorful tile appears. The tunes are structured original phrases, not random sounds.</p><button class="start" id="start">Start Music</button><div class="keys"><div>A</div><div>S</div><div>D</div><div>F</div></div></div></div></section></div><script>const board=document.getElementById('board'),lanes=[...document.querySelectorAll('.lane')],overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),modeEl=document.getElementById('mode'),menu=document.getElementById('menu');let audio,master,tiles=[],running=false,last=0,clock=0,idx=0,mode=0,score=0,combo=0,speed=270,gap=720,best=Number(localStorage.getItem('rainbowPianoBest')||0),loopOn=false;bestEl.textContent=best;const hz=[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880];const modes=[['🎤','tri',[0,2,4,2,5,4,2,1,0,2,4,5,4,2,1,2]],['🎸','rock',[2,4,5,5,4,2,1,2,4,5,7,5,4,2,1,2]],['🪩','dance',[4,4,6,8,6,4,5,6,8,8,6,5,4,5,6,4]],['🎮','chip',[0,2,4,7,4,2,1,3,5,8,5,3,2,4,6,9]],['💎','dream',[5,0,2,5,4,2,0,1,3,5,7,5,3,2,1,0]],['🚀','space',[0,4,7,6,4,2,5,4,1,5,8,7,5,3,6,5]],['🏖️','sun',[0,2,4,5,4,2,0,1,3,5,4,3,2,4,7,5]],['⭐','bell',[0,0,4,4,5,5,4,3,3,2,2,1,1,0]],['🐑','bell',[2,1,0,1,2,2,2,1,1,1,2,4,4,2,1,0]]];function laneFor(step){return [0,1,2,1,3,2,3,0,1,2,1,3,2][step%13]}function setMode(i){mode=(i+modes.length)%modes.length;idx=0;modeEl.textContent=modes[mode][0];[...menu.children].forEach((b,n)=>b.classList.toggle('active',n===mode));show(modes[mode][0],'ok')}function renderMenu(){menu.innerHTML=modes.map((m,i)=>'<button class="pick" data-i="'+i+'">'+m[0]+'</button>').join('');[...menu.children].forEach(b=>b.onclick=()=>{setMode(Number(b.dataset.i));tiles.forEach(t=>t.remove());tiles=[];clock=0})}function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.48;master.connect(audio.destination)}function tone(f,d=.2,type='triangle',vol=.55,delay=0){if(!audio)return;const now=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(master);o.start(now);o.stop(now+d+.03)}function play(step){const st=modes[mode][1],f=hz[step]||392;tone(f,.22,st==='rock'?'sawtooth':st==='chip'?'square':'triangle',st==='rock'?.34:.62);if(st==='tri'||st==='dance'||st==='sun')tone(f,.15,'sine',.18,.04);if(st==='rock')tone(164.81,.12,'square',.12);if(st==='dream'||st==='space')tone(f*2,.18,'sine',.13,.05)}function w(){return board.clientWidth/4}function scoreBy(v){score=Math.max(0,score+v);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('rainbowPianoBest',best)}}function makeTile(){const pat=modes[mode][2];if(idx>=pat.length){idx=0;show(modes[mode][0]+' again','ok')}const step=pat[idx++],lane=laneFor(step),tile=document.createElement('div');tile.className='tile c'+lane;tile.dataset.lane=lane;tile.dataset.step=step;tile.y=-125;tile.style.top=tile.y+'px';tile.style.left=(lane*w()+w()*.09)+'px';tile.style.width=(w()*.82)+'px';tile.innerHTML='♪<span>'+modes[mode][0]+'</span>';board.appendChild(tile);tiles.push(tile)}function flash(l){lanes[l].classList.add('flash');setTimeout(()=>lanes[l].classList.remove('flash'),100)}function spark(l){const s=document.createElement('div');s.className='spark';s.textContent=combo>8?'🌟':'⭐';s.style.left=(l*w()+w()/2-12)+'px';s.style.top=(board.clientHeight-170)+'px';board.appendChild(s);setTimeout(()=>s.remove(),700)}function show(t,k='ok'){comboEl.innerHTML='<span class="'+k+'">'+t+'</span>';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}function good(t){const l=Number(t.dataset.lane);t.classList.add('hit');play(Number(t.dataset.step));flash(l);spark(l);tiles=tiles.filter(x=>x!==t);setTimeout(()=>t.remove(),180);scoreBy(1+Math.floor(combo/8));combo++;show(combo>12?'🌈 +'+(1+Math.floor(combo/8)):combo>6?'✨ +'+(1+Math.floor(combo/8)):'+1','ok');if(score>25){speed=315;gap=640}if(score>55){speed=365;gap=560}}function bad(t='-1'){combo=0;scoreBy(-1);if(audio)tone(196,.1,'sine',.12);show(t,'bad')}function tap(lane){if(!running)return;const hit=tiles.filter(t=>Number(t.dataset.lane)===lane&&!t.classList.contains('hit')&&t.y+116>0&&t.y<board.clientHeight).sort((a,b)=>b.y-a.y)[0];if(hit)good(hit);else{flash(lane);bad('Oops -1')}}function reset(){tiles.forEach(t=>t.remove());tiles=[];score=0;combo=0;speed=270;gap=720;clock=0;idx=0;scoreEl.textContent=0}function start(){initAudio();audio.resume();reset();running=true;overlay.style.display='none';last=performance.now();if(!loopOn){loopOn=true;requestAnimationFrame(loop)}}function loop(t){if(!running){requestAnimationFrame(loop);return}const dt=Math.min(40,t-last);last=t;clock+=dt;if(clock>=gap){clock=0;makeTile()}tiles.slice().forEach(tile=>{tile.y+=speed*dt/1000;tile.style.top=tile.y+'px';tile.style.left=(Number(tile.dataset.lane)*w()+w()*.09)+'px';tile.style.width=(w()*.82)+'px';if(tile.y>board.clientHeight+24){tiles=tiles.filter(v=>v!==tile);tile.classList.add('miss');setTimeout(()=>tile.remove(),180);bad('Miss -1')}});requestAnimationFrame(loop)}lanes.forEach(l=>l.addEventListener('pointerdown',e=>{e.preventDefault();tap(Number(l.dataset.lane))},{passive:false}));document.addEventListener('keydown',e=>{const m={a:0,s:1,d:2,f:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};const l=m[e.key]??m[e.key.toLowerCase()];if(l!==undefined){e.preventDefault();tap(l)}});document.getElementById('start').onclick=start;document.getElementById('restart').onclick=()=>{if(!running)start();else{reset();last=performance.now();show('Restarted','ok')}};addEventListener('resize',()=>tiles.forEach(tile=>{tile.style.left=(Number(tile.dataset.lane)*w()+w()*.09)+'px';tile.style.width=(w()*.82)+'px'}));renderMenu();setMode(0);</script></body></html>
