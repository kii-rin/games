<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rainbow Piano Tiles</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff7ad,#ffd6ec 45%,#c8f4ff);color:#20243a;touch-action:none}.app{height:100vh;height:100dvh;display:grid;place-items:center;padding:10px}.board{position:relative;width:min(98vw,640px);height:calc(100dvh - 20px);max-height:900px;min-height:560px;overflow:hidden;border-radius:30px;border:7px solid white;background:#f8fbff;box-shadow:0 26px 70px rgba(32,36,58,.2);isolation:isolate}.hud{position:absolute;left:10px;right:10px;top:10px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:22px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);box-shadow:0 10px 26px rgba(32,36,58,.1);border:1px solid rgba(32,36,58,.08)}.brand{display:flex;align-items:center;gap:8px;min-width:0}.logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899,#fbbf24);font-size:20px;color:white}.title{font-size:16px;font-weight:1000;white-space:nowrap}.mini{font-size:11px;color:#667085;margin-top:1px;white-space:nowrap}.stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn,.back{border:0;border-radius:999px;background:white;color:#20243a;padding:7px 10px;font-weight:1000;text-decoration:none;box-shadow:0 5px 12px rgba(32,36,58,.1);font-size:12px}.btn{background:#20243a;color:white;cursor:pointer}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}.lane{position:relative;border-left:1px solid rgba(32,36,58,.08);overflow:hidden;cursor:pointer}.lane:first-child{border-left:0}.lane:nth-child(1){background:linear-gradient(#fff,#fff0),#eff6ff}.lane:nth-child(2){background:linear-gradient(#fff,#fff0),#fdf2f8}.lane:nth-child(3){background:linear-gradient(#fff,#fff0),#f0fdf4}.lane:nth-child(4){background:linear-gradient(#fff,#fff0),#fffbeb}.lane:active,.lane.flash{filter:brightness(.94)}.tile{position:absolute;left:9%;width:82%;height:116px;border-radius:23px;display:grid;place-items:center;font-size:35px;font-weight:1000;color:white;box-shadow:0 12px 26px rgba(32,36,58,.22);border:4px solid rgba(255,255,255,.86);will-change:transform,top}.tile .note{font-size:13px;letter-spacing:.12em;background:rgba(255,255,255,.28);border-radius:999px;padding:3px 8px;position:absolute;bottom:12px}.tile.hitok{animation:pop .22s ease forwards}.tile.missed{animation:fade .25s ease forwards}.tile.c0{background:linear-gradient(135deg,#60a5fa,#2563eb)}.tile.c1{background:linear-gradient(135deg,#f472b6,#db2777)}.tile.c2{background:linear-gradient(135deg,#34d399,#059669)}.tile.c3{background:linear-gradient(135deg,#fbbf24,#f97316)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.62));z-index:20;padding:24px;text-align:center}.card{width:min(92%,420px);background:white;border-radius:28px;padding:24px;box-shadow:0 26px 60px rgba(32,36,58,.18);border:1px solid #eef2f7}.card h2{font-size:30px;margin:0 0 8px}.card p{color:#667085;line-height:1.45;margin:0 0 16px}.big{font-size:46px;margin-bottom:8px}.start{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);color:white;padding:15px 18px;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 14px 26px rgba(236,72,153,.22)}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.key{background:#f8fafc;border:1px solid #e4e7ec;border-radius:14px;padding:8px 0;font-weight:1000;color:#475467}.combo{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:1000;font-size:34px;color:#20243a;text-shadow:0 3px 0 white;opacity:0;pointer-events:none;z-index:12}.combo.show{animation:combo .48s ease}.spark{position:absolute;font-size:23px;pointer-events:none;animation:spark .65s ease forwards;z-index:12}.safe{color:#059669}.minus{color:#ef4444}@keyframes pop{to{transform:scale(.75);opacity:0}}@keyframes fade{to{transform:scale(.85);opacity:.15;filter:grayscale(1)}}@keyframes combo{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.1)}}@keyframes spark{0%{opacity:1;transform:scale(.7) translateY(0)}100%{opacity:0;transform:scale(1.4) translateY(-42px)}}@media(max-width:700px){.app{padding:6px}.board{height:calc(100dvh - 12px);min-height:540px;border-radius:24px;border-width:5px}.hud{top:7px;left:7px;right:7px;padding:6px 7px;border-radius:18px}.logo{width:30px;height:30px;font-size:18px}.title{font-size:14px}.mini{display:none}.pill,.btn,.back{font-size:11px;padding:6px 8px}.tile{height:102px;border-radius:19px;font-size:31px}.card h2{font-size:25px}.stats{gap:4px}}
</style>
</head>
<body>
<div class="app"><section class="board" id="board"><div class="lanes" id="lanes"><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div></div><div class="hud"><div class="brand"><div class="logo">🎹</div><div><div class="title">Rainbow Piano Tiles</div><div class="mini">Whole lane is tappable</div></div></div><div class="stats"><span class="pill">Score <span id="score">0</span></span><span class="pill">Best <span id="best">0</span></span><a class="back" href="../index.html">Back</a><button class="btn" id="restart">Restart</button></div></div><div class="combo" id="combo">Nice!</div><div class="overlay" id="overlay"><div class="card"><div class="big">🌈🎵</div><h2>Ready?</h2><p>Tap anywhere in a lane when you see a colorful tile in that lane. Correct taps add points. Wrong taps or missed tiles subtract points, but the song keeps going.</p><button class="start" id="start">Start Music</button><div class="keys"><div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div></div></div></div></section></div>
<script>
const board=document.getElementById('board'),lanes=[...document.querySelectorAll('.lane')],overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo');
let audio,master,tiles=[],running=false,last=0,spawnClock=0,seqIndex=0,score=0,combo=0,speed=270,spawnEvery=720,best=Number(localStorage.getItem('rainbowPianoBest')||0),musicTimer=null,loopStarted=false;
bestEl.textContent=best;
const melody=[['C5',523.25,0],['D5',587.33,1],['E5',659.25,2],['G5',783.99,3],['E5',659.25,2],['D5',587.33,1],['C5',523.25,0],['G4',392.00,3],['A4',440.00,0],['C5',523.25,1],['D5',587.33,2],['E5',659.25,3],['D5',587.33,2],['C5',523.25,1],['A4',440.00,0],['G4',392.00,3]];
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.42;master.connect(audio.destination)}
function play(freq,d=.18,type='triangle',vol=.55){if(!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(master);o.start(now);o.stop(now+d+.03)}
function chord(){if(!running||!audio)return;[261.63,329.63,392].forEach((f,i)=>setTimeout(()=>play(f,.28,'sine',.1),i*80))}
function startPad(){clearInterval(musicTimer);musicTimer=setInterval(chord,1800);chord()}
function laneWidth(){return board.clientWidth/4}
function visibleTop(){return -112}
function visibleBottom(){return board.clientHeight+8}
function updateScore(v){score=Math.max(0,score+v);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('rainbowPianoBest',best)}}
function createTile(){const n=melody[seqIndex%melody.length];seqIndex++;const tile=document.createElement('div');tile.className='tile c'+n[2];tile.dataset.lane=n[2];tile.dataset.freq=n[1];tile.dataset.note=n[0];tile.y=-125;tile.style.top=tile.y+'px';tile.style.left=(n[2]*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px';tile.innerHTML='♪<span class="note">'+n[0]+'</span>';board.appendChild(tile);tiles.push(tile)}
function flash(lane){lanes[lane].classList.add('flash');setTimeout(()=>lanes[lane].classList.remove('flash'),100)}
function spark(lane,text='⭐'){const s=document.createElement('div');s.className='spark';s.textContent=text;s.style.left=(lane*laneWidth()+laneWidth()/2-12)+'px';s.style.top=(board.clientHeight-170)+'px';board.appendChild(s);setTimeout(()=>s.remove(),700)}
function showCombo(text,kind='safe'){comboEl.innerHTML='<span class="'+kind+'">'+text+'</span>';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}
function good(tile){const lane=Number(tile.dataset.lane);tile.classList.add('hitok');play(Number(tile.dataset.freq),.2,'triangle',.62);flash(lane);spark(lane,combo>8?'🌟':'⭐');tiles=tiles.filter(t=>t!==tile);setTimeout(()=>tile.remove(),180);updateScore(1+Math.floor(combo/8));combo++;showCombo(combo>12?'Rainbow +'+(1+Math.floor(combo/8)):combo>6?'Great +'+(1+Math.floor(combo/8)):'Nice +1','safe');if(score>25){speed=315;spawnEvery=640}if(score>55){speed=365;spawnEvery=560}}
function bad(text='-1'){combo=0;updateScore(-1);play(196,.12,'sine',.13);showCombo(text,'minus')}
function tapLane(lane){if(!running)return;const top=visibleTop(),bottom=visibleBottom();const candidates=tiles.filter(t=>Number(t.dataset.lane)===lane&&!t.classList.contains('hitok')&&t.y+116>top&&t.y<bottom).sort((a,b)=>b.y-a.y);const target=candidates[0];if(target)good(target);else{flash(lane);bad('Oops -1')}}
function reset(){tiles.forEach(t=>t.remove());tiles=[];score=0;combo=0;speed=270;spawnEvery=720;spawnClock=0;seqIndex=0;scoreEl.textContent=0}
function start(){initAudio();audio.resume();reset();running=true;overlay.style.display='none';last=performance.now();startPad();if(!loopStarted){loopStarted=true;requestAnimationFrame(loop)}}
function loop(t){if(!running){requestAnimationFrame(loop);return}const dt=Math.min(40,t-last);last=t;spawnClock+=dt;if(spawnClock>=spawnEvery){spawnClock=0;createTile()}tiles.slice().forEach(tile=>{tile.y+=speed*dt/1000;tile.style.top=tile.y+'px';tile.style.left=(Number(tile.dataset.lane)*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px';if(tile.y>board.clientHeight+24){tiles=tiles.filter(v=>v!==tile);tile.classList.add('missed');setTimeout(()=>tile.remove(),180);bad('Miss -1')}});requestAnimationFrame(loop)}
lanes.forEach(l=>l.addEventListener('pointerdown',e=>{e.preventDefault();tapLane(Number(l.dataset.lane))},{passive:false}));
document.addEventListener('keydown',e=>{const map={a:0,s:1,d:2,f:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};const lane=map[e.key]??map[e.key.toLowerCase()];if(lane!==undefined){e.preventDefault();tapLane(lane)}});
document.getElementById('start').onclick=start;document.getElementById('restart').onclick=()=>{if(!running)start();else{reset();last=performance.now();showCombo('Restarted','safe')}};addEventListener('resize',()=>tiles.forEach(tile=>{tile.style.left=(Number(tile.dataset.lane)*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px'}));
</script>
</body>
</html>
