<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rainbow Piano Tiles</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff7ad,#ffd6ec 45%,#c8f4ff);color:#20243a;touch-action:none}.app{height:100dvh;display:grid;place-items:center;padding:6px}.board{position:relative;width:min(99vw,680px);height:calc(100dvh - 12px);min-height:540px;overflow:hidden;border-radius:28px;border:5px solid white;background:#f8fbff;box-shadow:0 24px 60px #20243a33;isolation:isolate}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}.lane{border-left:1px solid #20243a16;cursor:pointer;overflow:hidden}.lane:first-child{border-left:0}.lane:nth-child(1){background:#eff6ff}.lane:nth-child(2){background:#fdf2f8}.lane:nth-child(3){background:#f0fdf4}.lane:nth-child(4){background:#fffbeb}.lane.flash{filter:brightness(.92)}.hud{position:absolute;left:8px;right:8px;top:8px;z-index:10;display:grid;gap:4px;padding:6px;border-radius:18px;background:#ffffff7a;backdrop-filter:blur(8px);box-shadow:0 6px 18px #20243a12;border:1px solid #ffffff85}.top{display:flex;align-items:center;justify-content:space-between;gap:6px}.stats{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.pill,.btn,.pick{border:0;border-radius:999px;background:#ffffffbd;color:#20243a;padding:5px 8px;font-size:11px;font-weight:1000;text-decoration:none;box-shadow:0 4px 10px #20243a12}.btn{background:#20243ad9;color:white}.btn.on{background:linear-gradient(135deg,#22c55e,#06b6d4)}.menu{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.menu::-webkit-scrollbar{display:none}.pick{height:29px;padding:0 8px;white-space:nowrap;border:2px solid transparent}.pick b{font-size:14px;margin-right:3px}.pick.active{border-color:#8b5cf6;background:#fff7fddd}.tile{position:absolute;width:82%;height:112px;border-radius:23px;display:grid;place-items:center;font-size:35px;color:white;border:4px solid #ffffffdd;box-shadow:0 12px 26px #20243a38;will-change:top,left,width;pointer-events:none}.tile span{position:absolute;bottom:10px;background:#ffffff44;border-radius:999px;padding:2px 8px;font-size:13px}.c0{background:linear-gradient(135deg,#60a5fa,#2563eb)}.c1{background:linear-gradient(135deg,#f472b6,#db2777)}.c2{background:linear-gradient(135deg,#34d399,#059669)}.c3{background:linear-gradient(135deg,#fbbf24,#f97316)}.hit{animation:pop .22s ease forwards}.miss{animation:fade .25s ease forwards}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:#ffffffbb;padding:22px}.card{width:min(92%,430px);background:white;border-radius:28px;padding:24px;box-shadow:0 24px 55px #20243a25}.big{font-size:48px}.card h2{font-size:29px;margin:6px 0}.card p{color:#667085;line-height:1.45}.start{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);color:white;padding:15px;font-size:18px;font-weight:1000}.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.link{border-radius:999px;background:#f8fafc;color:#20243a;text-decoration:none;padding:8px 12px;font-weight:900}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.keys div{background:#f8fafc;border:1px solid #e4e7ec;border-radius:14px;padding:8px 0;font-weight:1000}.combo{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-weight:1000;font-size:34px;text-shadow:0 3px 0 white;opacity:0;pointer-events:none;z-index:12}.combo.show{animation:combo .5s ease}.ok{color:#059669}.bad{color:#ef4444}.spark{position:absolute;font-size:23px;pointer-events:none;animation:spark .65s ease forwards;z-index:12}@keyframes pop{to{transform:scale(.74);opacity:0}}@keyframes fade{to{transform:scale(.86);opacity:.16;filter:grayscale(1)}}@keyframes combo{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.1)}}@keyframes spark{0%{opacity:1;transform:scale(.7) translateY(0)}100%{opacity:0;transform:scale(1.4) translateY(-42px)}}@media(max-width:700px){.board{height:calc(100dvh - 10px);border-radius:22px}.pill,.btn,.pick{font-size:10px;padding:5px 7px}.pick{height:28px}.pick b{font-size:13px}.tile{height:102px;font-size:31px}.hud{left:6px;right:6px;top:6px}}</style></head><body><div class="app"><section class="board" id="board"><div class="lanes"><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div></div><div class="hud" id="hud"><div class="top"><div class="stats"><span class="pill">Score <span id="score">0</span></span><span class="pill">Best <span id="best">0</span></span></div><div class="stats"><button class="btn" id="auto">Auto</button><button class="btn" id="restart">Restart</button></div></div><div class="menu" id="menu"></div></div><div class="combo" id="combo">+1</div><div class="overlay" id="overlay"><div class="card"><div class="big">🌈🎵</div><h2>Ready?</h2><p>Choose a song, including Beat Bloom songs. Auto shows the proper play. While Auto is on, tap lanes to add extra tones on top.</p><button class="start" id="start">Start Music</button><div class="links"><a class="link" href="../songMaker/songMaker.html">Beat Bloom Studio</a><a class="link" href="../index.html">Games</a></div><div class="keys"><div>A</div><div>S</div><div>D</div><div>F</div></div></div></div></section></div><script>const board=document.getElementById('board'),hud=document.getElementById('hud'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),menu=document.getElementById('menu'),autoBtn=document.getElementById('auto');let audio,master,tiles=[],running=false,last=0,clock=0,idx=0,mode=0,score=0,combo=0,speed=270,gap=720,best=Number(localStorage.getItem('rainbowPianoBest')||0),loopOn=false,autoPlay=false;bestEl.textContent=best;const hz=[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880];const built=[{e:'🎵',n:'Ode to Joy',s:'piano',p:[2,2,3,4,4,3,2,1,0,0,1,2,2,1,1]},{e:'⭐',n:'Twinkle Twinkle',s:'bell',p:[0,0,4,4,5,5,4,3,3,2,2,1,1,0]},{e:'🐑',n:"Mary's Lamb",s:'toy',p:[2,1,0,1,2,2,2,1,1,1,2,4,4,2,1,0]},{e:'🎤',n:'Original Pop',s:'piano',p:[0,2,4,2,5,4,2,1,0,2,4,5,4,2,1,2]},{e:'🎸',n:'Original Rock',s:'guitar',p:[2,4,5,5,4,2,1,2,4,5,7,5,4,2,1,2]},{e:'🪩',n:'Original Disco',s:'marimba',p:[4,4,6,8,6,4,5,6,8,8,6,5,4,5,6,4]},{e:'🎮',n:'Original Game',s:'toy',p:[0,2,4,7,4,2,1,3,5,8,5,3,2,4,6,9]},{e:'💎',n:'Original Fantasy',s:'bell',p:[5,0,2,5,4,2,0,1,3,5,7,5,3,2,1,0]},{e:'🚀',n:'Original Space',s:'flute',p:[0,4,7,6,4,2,5,4,1,5,8,7,5,3,6,5]},{e:'🏖️',n:'Original Island',s:'marimba',p:[0,2,4,5,4,2,0,1,3,5,4,3,2,4,7,5]}];let modes=[];function loadModes(){let user=[];try{user=JSON.parse(localStorage.getItem('rainbowPianoSongs')||'[]')}catch{}modes=built.concat(user.filter(s=>s&&s.pattern).map(s=>({e:s.emoji||'🎵',n:s.name||'My Song',s:s.sound||'piano',custom:true,tempo:s.tempo||105,p:customSeq(s)})).filter(m=>m.p.length))}function customSeq(s){const rowData=[[0,523.25,'✨','note'],[1,659.25,'⭐','note'],[2,783.99,'🌙','note'],[3,880,'☀️','note'],[0,110,'🥁','kick'],[1,220,'👏','clap'],[2,1760,'💧','hat'],[3,196,'🟣','bass']];let groups=[],p=s.pattern||[];for(let c=0;c<16;c++){let g=[];for(let r=0;r<rowData.length;r++)if(p[r]&&p[r][c]){let d=rowData[r];g.push({lane:d[0],freq:d[1],label:d[2],kind:d[3]})}groups.push(g)}return groups}function laneFor(step){return [0,1,2,1,3,2,3,0,1,2,1,3,2][step%13]}function setMode(i){mode=(i+modes.length)%modes.length;idx=0;[...menu.children].forEach((b,n)=>b.classList.toggle('active',n===mode));show(modes[mode].e+' '+modes[mode].n,'ok');gap=modes[mode].custom?Math.max(360,Math.min(900,60000/(modes[mode].tempo||105)/2)):720}function renderMenu(){loadModes();menu.innerHTML=modes.map((m,i)=>'<button class="pick" data-i="'+i+'"><b>'+m.e+'</b>'+m.n+'</button>').join('');[...menu.children].forEach(b=>b.onclick=()=>{setMode(Number(b.dataset.i));tiles.forEach(t=>t.remove());tiles=[];clock=0});setMode(Math.min(mode,modes.length-1))}function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.58;master.connect(audio.destination)}function osc(f,type,d,vol,delay=0,filter=3600){const now=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain(),q=audio.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,now);q.type='lowpass';q.frequency.setValueAtTime(filter,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(q);q.connect(g);g.connect(master);o.start(now);o.stop(now+d+.05)}function noise(d,vol,filter=2500,delay=0){const now=audio.currentTime+delay,b=audio.createBuffer(1,Math.max(1,audio.sampleRate*d),audio.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const src=audio.createBufferSource(),g=audio.createGain(),q=audio.createBiquadFilter();src.buffer=b;q.type='bandpass';q.frequency.value=filter;q.Q.value=1.8;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+d);src.connect(q);q.connect(g);g.connect(master);src.start(now);src.stop(now+d)}function instrument(f,kind='piano'){if(kind==='bell'){osc(f,'sine',1,.38,0,5200);osc(f*2.01,'sine',1.1,.13,.01,6200);osc(f*3.02,'sine',.72,.05,.02,6200)}else if(kind==='guitar'){osc(f*.997,'triangle',.55,.34,0,1650);osc(f*1.5,'sine',.36,.1,.012,1900);noise(.045,.035,1800)}else if(kind==='marimba'){osc(f,'sine',.32,.5,0,3200);osc(f*2.99,'sine',.18,.13,.004,3800);noise(.025,.025,2600)}else if(kind==='flute'){osc(f,'sine',.62,.3,0,1350);osc(f*2,'sine',.55,.08,.015,1700)}else if(kind==='toy'){osc(f,'triangle',.38,.43,0,2600);osc(f*2,'sine',.28,.12,.01,3400)}else{osc(f,'triangle',.55,.38,0,2800);osc(f*2,'sine',.33,.1,.012,3600);osc(f*3,'sine',.18,.04,.018,4200)}}function drum(kind){if(kind==='kick'){osc(120,'sine',.18,.55,0,900);osc(55,'sine',.2,.18,.01,500)}else if(kind==='clap'){noise(.16,.32,1800);noise(.12,.18,2600,.035)}else if(kind==='hat'){noise(.08,.18,7000)}else if(kind==='bass'){instrument(196,'guitar')}}function playData(d){if(d.kind&&d.kind!=='note')drum(d.kind);else instrument(d.freq,modes[mode].s||'piano')}function w(){return board.clientWidth/4}function scoreBy(v){score=Math.max(0,score+v);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('rainbowPianoBest',best)}}function nextGroup(){const m=modes[mode];if(idx>=m.p.length){idx=0;show(m.e+' again','ok')}const item=m.p[idx++];if(m.custom)return item;if(Array.isArray(item))return item;const lane=laneFor(item);return[{lane,freq:hz[item]||392,label:m.e,kind:'note'}]}function makeGroup(){const group=nextGroup();if(!group||!group.length)return;group.forEach(d=>{const tile=document.createElement('div');tile.className='tile c'+d.lane;tile.dataset.lane=d.lane;tile.dataset.freq=d.freq;tile.dataset.kind=d.kind||'note';tile.y=-125;tile.style.top=tile.y+'px';tile.style.left=(d.lane*w()+w()*.09)+'px';tile.style.width=(w()*.82)+'px';tile.innerHTML='♪<span>'+d.label+'</span>';board.appendChild(tile);tiles.push(tile)})}function flash(l){const lane=document.querySelector('.lane[data-lane="'+l+'"]');if(lane){lane.classList.add('flash');setTimeout(()=>lane.classList.remove('flash'),100)}}function spark(l,text){const s=document.createElement('div');s.className='spark';s.textContent=text||combo>8?'🌟':'⭐';s.style.left=(l*w()+w()/2-12)+'px';s.style.top=(board.clientHeight-170)+'px';board.appendChild(s);setTimeout(()=>s.remove(),700)}function show(t,k='ok'){comboEl.innerHTML='<span class="'+k+'">'+t+'</span>';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}function good(t,auto=false){const l=Number(t.dataset.lane);t.classList.add('hit');playData({freq:Number(t.dataset.freq)||392,kind:t.dataset.kind});flash(l);spark(l);tiles=tiles.filter(x=>x!==t);setTimeout(()=>t.remove(),180);scoreBy(auto?1:1+Math.floor(combo/8));if(!auto)combo++;show(auto?'Auto +1':combo>12?'🌈 +'+(1+Math.floor(combo/8)):combo>6?'✨ +'+(1+Math.floor(combo/8)):'+1','ok');if(!modes[mode].custom&&score>25){speed=315;gap=640}if(!modes[mode].custom&&score>55){speed=365;gap=560}}function addTone(lane){const notes=[523.25,659.25,783.99,880];instrument(notes[lane]||523.25,modes[mode].s||'piano');flash(lane);spark(lane,'🎶');show('Extra tone','ok')}function bad(t='-1'){combo=0;scoreBy(-1);if(audio)instrument(196,'toy');show(t,'bad')}function tap(lane){if(!running)return;const hit=tiles.filter(t=>Number(t.dataset.lane)===lane&&!t.classList.contains('hit')&&t.y+116>0&&t.y<board.clientHeight).sort((a,b)=>b.y-a.y)[0];if(hit)good(hit,false);else if(autoPlay)addTone(lane);else{flash(lane);bad('Oops -1')}}function autoHit(){if(!autoPlay||!running)return;const line=board.clientHeight*.58;tiles.slice().filter(t=>!t.classList.contains('hit')&&t.y>line&&t.y<board.clientHeight).forEach(t=>good(t,true))}function reset(){tiles.forEach(t=>t.remove());tiles=[];score=0;combo=0;speed=270;clock=0;idx=0;scoreEl.textContent=0;renderMenu()}function start(){initAudio();audio.resume();reset();running=true;overlay.style.display='none';last=performance.now();if(!loopOn){loopOn=true;requestAnimationFrame(loop)}}function loop(t){if(!running){requestAnimationFrame(loop);return}const dt=Math.min(40,t-last);last=t;clock+=dt;if(clock>=gap){clock=0;makeGroup()}tiles.slice().forEach(tile=>{tile.y+=speed*dt/1000;tile.style.top=tile.y+'px';tile.style.left=(Number(tile.dataset.lane)*w()+w()*.09)+'px';tile.style.width=(w()*.82)+'px';if(tile.y>board.clientHeight+24&&!tile.classList.contains('hit')){tiles=tiles.filter(v=>v!==tile);tile.classList.add('miss');setTimeout(()=>tile.remove(),180);if(!autoPlay)bad('Miss -1')}});autoHit();requestAnimationFrame(loop)}board.addEventListener('pointerdown',e=>{if(e.target.closest('#hud')||e.target.closest('#overlay'))return;e.preventDefault();const r=board.getBoundingClientRect(),lane=Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/(r.width/4))));tap(lane)},{passive:false});document.addEventListener('keydown',e=>{const m={a:0,s:1,d:2,f:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};const l=m[e.key]??m[e.key.toLowerCase()];if(l!==undefined){e.preventDefault();tap(l)}});document.getElementById('start').onclick=start;document.getElementById('restart').onclick=()=>{if(!running)start();else{reset();last=performance.now();show('Restarted','ok')}};autoBtn.onclick=()=>{autoPlay=!autoPlay;autoBtn.classList.toggle('on',autoPlay);autoBtn.textContent=autoPlay?'Auto On':'Auto';if(!running)start();else show(autoPlay?'Auto On':'Auto Off','ok')};addEventListener('resize',()=>tiles.forEach(tile=>{tile.style.left=(Number(tile.dataset.lane)*w()+w()*.09)+'px';tile.style.width=(w()*.82)}));renderMenu();</script></body></html>
