<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rainbow Piano Tiles</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff7ad,#ffd6ec 45%,#c8f4ff);color:#20243a;touch-action:none}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-bottom:1px solid rgba(32,36,58,.08);box-shadow:0 10px 28px rgba(32,36,58,.08);z-index:10}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899,#fbbf24);font-size:24px;color:white;box-shadow:0 8px 18px rgba(139,92,246,.25)}h1{font-size:20px;margin:0;line-height:1}.sub{font-size:12px;color:#667085;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn,.back{border:0;border-radius:999px;background:white;color:#20243a;padding:9px 12px;font-weight:900;text-decoration:none;box-shadow:0 6px 14px rgba(32,36,58,.1);font-size:13px}.btn{background:#20243a;color:white;cursor:pointer}.stage{position:relative;padding:14px;min-height:0;display:grid;place-items:center}.board{position:relative;width:min(96vw,620px);height:100%;max-height:820px;min-height:520px;overflow:hidden;border-radius:28px;border:7px solid white;background:#f8fbff;box-shadow:0 26px 70px rgba(32,36,58,.2);isolation:isolate}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}.lane{position:relative;border-left:1px solid rgba(32,36,58,.08);overflow:hidden}.lane:first-child{border-left:0}.lane:nth-child(1){background:linear-gradient(#fff,#fff0),#eff6ff}.lane:nth-child(2){background:linear-gradient(#fff,#fff0),#fdf2f8}.lane:nth-child(3){background:linear-gradient(#fff,#fff0),#f0fdf4}.lane:nth-child(4){background:linear-gradient(#fff,#fff0),#fffbeb}.lane:active,.lane.flash{filter:brightness(.96)}.hit{position:absolute;left:0;right:0;bottom:92px;height:112px;border-top:4px dashed rgba(32,36,58,.18);border-bottom:4px dashed rgba(32,36,58,.18);background:rgba(255,255,255,.42);pointer-events:none}.hit:after{content:"TAP HERE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:1000;color:rgba(32,36,58,.35);letter-spacing:.18em}.tile{position:absolute;left:9%;width:82%;height:112px;border-radius:22px;display:grid;place-items:center;font-size:34px;font-weight:1000;color:white;box-shadow:0 12px 26px rgba(32,36,58,.22);border:4px solid rgba(255,255,255,.8);will-change:transform,top}.tile .note{font-size:13px;letter-spacing:.12em;background:rgba(255,255,255,.28);border-radius:999px;padding:3px 8px;position:absolute;bottom:12px}.tile.hitok{animation:pop .22s ease forwards}.tile.missed{opacity:.35;filter:grayscale(1)}.tile.c0{background:linear-gradient(135deg,#60a5fa,#2563eb)}.tile.c1{background:linear-gradient(135deg,#f472b6,#db2777)}.tile.c2{background:linear-gradient(135deg,#34d399,#059669)}.tile.c3{background:linear-gradient(135deg,#fbbf24,#f97316)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.62));z-index:20;padding:24px;text-align:center}.card{width:min(92%,420px);background:white;border-radius:28px;padding:24px;box-shadow:0 26px 60px rgba(32,36,58,.18);border:1px solid #eef2f7}.card h2{font-size:30px;margin:0 0 8px}.card p{color:#667085;line-height:1.45;margin:0 0 16px}.big{font-size:46px;margin-bottom:8px}.start{width:100%;border:0;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);color:white;padding:15px 18px;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 14px 26px rgba(236,72,153,.22)}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.key{background:#f8fafc;border:1px solid #e4e7ec;border-radius:14px;padding:8px 0;font-weight:1000;color:#475467}.life{color:#ef4444}.combo{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-weight:1000;font-size:34px;color:#20243a;text-shadow:0 3px 0 white;opacity:0;pointer-events:none;z-index:9}.combo.show{animation:combo .48s ease}.spark{position:absolute;font-size:22px;pointer-events:none;animation:spark .65s ease forwards;z-index:12}@keyframes pop{to{transform:scale(.75);opacity:0}}@keyframes combo{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.1)}}@keyframes spark{0%{opacity:1;transform:scale(.7) translateY(0)}100%{opacity:0;transform:scale(1.4) translateY(-42px)}}@media(max-width:700px){.top{padding:10px 11px}.logo{width:38px;height:38px}.sub{display:none}h1{font-size:17px}.pill,.btn,.back{font-size:12px;padding:8px 10px}.stage{padding:8px}.board{min-height:500px;border-radius:24px;border-width:5px}.tile{height:96px;border-radius:18px;font-size:30px}.hit{bottom:72px;height:100px}.card h2{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🎹</div><div><h1>Rainbow Piano Tiles</h1><div class="sub">Tap the colorful notes and make music</div></div></div><div class="stats"><span class="pill">Score <span id="score">0</span></span><span class="pill">Best <span id="best">0</span></span><span class="pill life" id="lives">♥♥♥</span><a class="back" href="../index.html">Back</a><button class="btn" id="restart">Restart</button></div></header>
<main class="stage"><section class="board" id="board"><div class="lanes" id="lanes"><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div></div><div class="hit"></div><div class="combo" id="combo">Nice!</div><div class="overlay" id="overlay"><div class="card"><div class="big">🌈🎵</div><h2>Ready?</h2><p>Tap each rainbow tile when it reaches the tap zone. Every good tap plays part of the song.</p><button class="start" id="start">Start Music</button><div class="keys"><div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div></div></div></div></section></main>
</div>
<script>
const board=document.getElementById('board'),lanes=[...document.querySelectorAll('.lane')],overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),comboEl=document.getElementById('combo');
let audio,master,tiles=[],running=false,last=0,spawnClock=0,seqIndex=0,score=0,combo=0,lives=3,speed=285,spawnEvery=680,best=Number(localStorage.getItem('rainbowPianoBest')||0),musicTimer=null;
bestEl.textContent=best;
const melody=[['C5',523.25,0],['D5',587.33,1],['E5',659.25,2],['G5',783.99,3],['E5',659.25,2],['D5',587.33,1],['C5',523.25,0],['G4',392.00,3],['A4',440.00,0],['C5',523.25,1],['D5',587.33,2],['E5',659.25,3],['D5',587.33,2],['C5',523.25,1],['A4',440.00,0],['G4',392.00,3]];
function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.42;master.connect(audio.destination)}
function play(freq,d=.18,type='triangle',vol=.55){if(!audio)return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(master);o.start(now);o.stop(now+d+.03)}
function chord(){if(!running||!audio)return;[261.63,329.63,392].forEach((f,i)=>setTimeout(()=>play(f,.28,'sine',.12),i*80))}
function startPad(){clearInterval(musicTimer);musicTimer=setInterval(chord,1800);chord()}
function laneWidth(){return board.clientWidth/4}
function hitTop(){return board.clientHeight-204}
function hitBottom(){return board.clientHeight-72}
function createTile(){const n=melody[seqIndex%melody.length];seqIndex++;const tile=document.createElement('div');tile.className='tile c'+n[2];tile.dataset.lane=n[2];tile.dataset.freq=n[1];tile.dataset.note=n[0];tile.y=-120;tile.style.top=tile.y+'px';tile.style.left=(n[2]*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px';tile.innerHTML='♪<span class="note">'+n[0]+'</span>';board.appendChild(tile);tiles.push(tile)}
function flash(lane){lanes[lane].classList.add('flash');setTimeout(()=>lanes[lane].classList.remove('flash'),100)}
function spark(lane,text='⭐'){const s=document.createElement('div');s.className='spark';s.textContent=text;s.style.left=(lane*laneWidth()+laneWidth()/2-12)+'px';s.style.top=(board.clientHeight-150)+'px';board.appendChild(s);setTimeout(()=>s.remove(),700)}
function showCombo(text){comboEl.textContent=text;comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}
function good(tile){const lane=Number(tile.dataset.lane);tile.classList.add('hitok');play(Number(tile.dataset.freq),.2,'triangle',.62);flash(lane);spark(lane,combo>8?'🌟':'⭐');tiles=tiles.filter(t=>t!==tile);setTimeout(()=>tile.remove(),180);score+=1+Math.floor(combo/8);combo++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('rainbowPianoBest',best)}showCombo(combo>12?'Rainbow!':combo>6?'Great!':'Nice!');if(score>25){speed=330;spawnEvery=590}if(score>55){speed=385;spawnEvery=510}}
function bad(){lives--;combo=0;livesEl.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));play(146.83,.22,'sawtooth',.16);showCombo('Try again');if(lives<=0)gameOver()}
function tapLane(lane){if(!running)return;const top=hitTop(),bottom=hitBottom();const candidates=tiles.filter(t=>Number(t.dataset.lane)===lane&&!t.classList.contains('hitok')).sort((a,b)=>b.y-a.y);const target=candidates.find(t=>t.y+96>top&&t.y<bottom);if(target)good(target);else{flash(lane);bad()}}
function gameOver(){running=false;clearInterval(musicTimer);overlay.style.display='grid';overlay.querySelector('h2').textContent='Song finished';overlay.querySelector('p').textContent='Score: '+score+'. Tap Start Music to play again.';overlay.querySelector('.start').textContent='Play Again'}
function reset(){tiles.forEach(t=>t.remove());tiles=[];score=0;combo=0;lives=3;speed=285;spawnEvery=680;spawnClock=0;seqIndex=0;scoreEl.textContent=0;livesEl.textContent='♥♥♥'}
function start(){initAudio();audio.resume();reset();running=true;overlay.style.display='none';last=performance.now();startPad();requestAnimationFrame(loop)}
function loop(t){if(!running)return;const dt=Math.min(40,t-last);last=t;spawnClock+=dt;if(spawnClock>=spawnEvery){spawnClock=0;createTile()}tiles.slice().forEach(tile=>{tile.y+=speed*dt/1000;tile.style.top=tile.y+'px';tile.style.left=(Number(tile.dataset.lane)*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px';if(tile.y>board.clientHeight+20){tiles=tiles.filter(v=>v!==tile);tile.remove();bad()}});requestAnimationFrame(loop)}
lanes.forEach(l=>l.addEventListener('pointerdown',e=>{e.preventDefault();tapLane(Number(l.dataset.lane))},{passive:false}));
document.addEventListener('keydown',e=>{const map={a:0,s:1,d:2,f:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};const lane=map[e.key]??map[e.key.toLowerCase()];if(lane!==undefined){e.preventDefault();tapLane(lane)}});
document.getElementById('start').onclick=start;document.getElementById('restart').onclick=()=>{if(running){reset();last=performance.now()}else start()};addEventListener('resize',()=>tiles.forEach(tile=>{tile.style.left=(Number(tile.dataset.lane)*laneWidth()+laneWidth()*.09)+'px';tile.style.width=(laneWidth()*.82)+'px'}));
</script>
</body>
</html>
