<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Beat Bloom Studio</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#dff4ff,#fff2b8,#ffd8ec);color:#20243a;padding:10px}.app{max-width:980px;margin:auto}.top,.panel{background:#ffffffdd;border-radius:24px;padding:12px;margin-bottom:12px;box-shadow:0 14px 34px #20243a18}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);display:grid;place-items:center;font-size:27px}h1{font-size:22px;margin:0}.sub,.hint{color:#667085;font-size:13px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn,.back,input,select{border:0;border-radius:999px;background:white;color:#20243a;padding:9px 12px;font-weight:900;text-decoration:none;box-shadow:0 6px 14px #20243a15}.btn{background:#20243a;color:white}.hot{background:linear-gradient(135deg,#8b5cf6,#ec4899)}.danger{background:#ef4444;color:white}.grid{display:grid;grid-template-columns:92px repeat(16,1fr);gap:6px;align-items:center;overflow-x:auto;padding-bottom:8px}.label,.head,.cell{height:42px;border-radius:14px;display:grid;place-items:center;font-weight:1000}.label{justify-content:start;padding-left:10px;background:white}.head{font-size:12px;background:#f8fafc;color:#667085}.cell{border:2px solid #e4e7ec;background:white;font-size:20px}.cell.on{border-color:#8b5cf6;background:linear-gradient(135deg,#ede9fe,#fce7f3);box-shadow:0 7px 16px #8b5cf633}.cell.play{outline:4px solid #22c55e}.box{width:100%;min-height:130px;border:1px solid #e4e7ec;border-radius:18px;padding:10px;font-family:ui-monospace,Menlo,monospace;background:white}.saved{display:flex;gap:7px;flex-wrap:wrap}.songChip{display:inline-flex;align-items:center;gap:5px;background:white;border-radius:999px;padding:5px;box-shadow:0 5px 12px #20243a12}.chip,.x{border:0;border-radius:999px;background:transparent;padding:7px 9px;font-weight:900}.x{background:#fee2e2;color:#991b1b}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#20243a;color:white;border-radius:999px;padding:10px 16px;font-weight:1000;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:720px){.grid{grid-template-columns:70px repeat(16,36px)}.label,.head,.cell{height:38px}.label{font-size:12px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🌸</div><div><h1>Beat Bloom Studio</h1><div class="sub">Make loops, save many songs, and send them to Piano Tiles.</div></div></div><div class="controls"><a class="back" href="../index.html">Back</a><a class="back" href="../pianoTiles/pianoTiles.html">Piano Tiles</a></div></header><section class="panel"><div class="controls"><input id="songName" value=""><select id="emoji"><option>🌸</option><option>🎤</option><option>🎸</option><option>🪩</option><option>🎮</option><option>💎</option><option>🚀</option><option>🏖️</option></select><select id="sound"><option value="toy">Toy Piano</option><option value="bell">Bell</option><option value="marimba">Marimba</option><option value="guitar">Soft Guitar</option><option value="flute">Flute</option></select><label class="back">Tempo <input id="tempo" type="range" min="70" max="180" value="105"></label><button class="btn" id="newName">New Name</button></div><p class="hint">Tap boxes on and off. Save always creates a new song, even if the name is similar. Send adds another custom song to Rainbow Piano Tiles.</p><div class="grid" id="grid"></div><div class="controls"><button class="btn hot" id="play">Play</button><button class="btn" id="stop">Stop</button><button class="btn" id="magic">Magic Fill</button><button class="btn" id="clear">Clear</button><button class="btn" id="save">Save New</button><button class="btn" id="send">Add to Piano Tiles</button><button class="btn" id="export">Show JSON</button></div></section><section class="panel"><h2>Saved Songs</h2><div class="saved" id="saved"></div></section><section class="panel"><h2>Import / Export JSON</h2><textarea class="box" id="jsonBox"></textarea><div class="controls"><button class="btn" id="loadJson">Load JSON</button></div></section></div><div class="toast" id="toast">Saved</div><script>const grid=document.getElementById('grid'),toast=document.getElementById('toast'),jsonBox=document.getElementById('jsonBox'),saved=document.getElementById('saved'),nameEl=document.getElementById('songName'),emojiEl=document.getElementById('emoji'),tempoEl=document.getElementById('tempo'),soundEl=document.getElementById('sound');const KEY='beatBloomSongs',PIANO='rainbowPianoSongs';let audio,master,timer,step=0;const rows=[['Glow','✨',523.25,0],['Star','⭐',659.25,1],['Moon','🌙',783.99,2],['Sun','☀️',880,3],['Boom','🥁',130.81,0],['Clap','👏',220,1],['Tick','💧',1760,2],['Bass','🟣',196,3]];const nameWords=['Bubble Garden','Pixel Picnic','Star Parade','Rainbow Hop','Cloud Dance','Moon Meadow','Jelly Jam','Rocket Bloom','Crystal Dots','Sunny Steps'];let pat=Array.from({length:8},()=>Array(16).fill(false));function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}function list(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}}function niceBase(){return nameWords[list(KEY).length%nameWords.length]}function uniqueName(base,arr){base=(base||niceBase()).trim()||niceBase();let names=new Set(arr.map(s=>s.name));if(!names.has(base))return base;let n=2;while(names.has(base+' '+n))n++;return base+' '+n}function setFreshName(){nameEl.value=uniqueName(niceBase(),list(KEY).concat(list(PIANO)));exportJson()}function init(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.52;master.connect(audio.destination)}function tone(f,type,vol=.5){init();const n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),q=audio.createBiquadFilter();o.type=type==='guitar'?'triangle':type==='flute'?'sine':type==='bell'?'sine':'triangle';q.type='lowpass';q.frequency.value=type==='flute'?1600:2800;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+(type==='bell'?.75:.32));o.frequency.value=f;o.connect(q);q.connect(g);g.connect(master);o.start(n);o.stop(n+1)}function drum(i){init();tone(i===4?95:i===5?230:1200,'toy',i===6?.15:.35)}function draw(){grid.innerHTML='';grid.appendChild(document.createElement('div'));for(let c=0;c<16;c++){let h=document.createElement('div');h.className='head';h.textContent=c+1;grid.appendChild(h)}rows.forEach((r,ri)=>{let l=document.createElement('div');l.className='label';l.textContent=r[1]+' '+r[0];grid.appendChild(l);for(let c=0;c<16;c++){let b=document.createElement('button');b.className='cell'+(pat[ri][c]?' on':'');b.textContent=pat[ri][c]?r[1]:'';b.onclick=()=>{pat[ri][c]=!pat[ri][c];draw();exportJson()};grid.appendChild(b)}})}function mark(c){[...grid.querySelectorAll('.cell')].forEach((el,i)=>el.classList.toggle('play',i%16===c))}function tick(){mark(step);pat.forEach((row,ri)=>{if(row[step])ri>=4&&ri<=6?drum(ri):tone(rows[ri][2],soundEl.value,ri===7?.3:.5)});step=(step+1)%16}function play(){init();audio.resume();stop();step=0;tick();timer=setInterval(tick,60000/Number(tempoEl.value)/2)}function stop(){clearInterval(timer);mark(-1)}function makeSong(name){let tiles=[];for(let c=0;c<16;c++)pat.forEach((row,ri)=>{if(row[c]&&ri<4)tiles.push({lane:rows[ri][3],freq:rows[ri][2],label:rows[ri][1]})});return{id:uid(),type:'beat-bloom-song',version:2,name,emoji:emojiEl.value,sound:soundEl.value,tempo:Number(tempoEl.value),pattern:pat,tiles}}function song(){return makeSong(nameEl.value||niceBase())}function exportJson(){jsonBox.value=JSON.stringify(song(),null,2)}function load(d){nameEl.value=uniqueName(d.name||niceBase(),list(KEY).concat(list(PIANO)));emojiEl.value=d.emoji||'🌸';soundEl.value=d.sound||'toy';tempoEl.value=d.tempo||105;pat=Array.isArray(d.pattern)?d.pattern:pat;draw();exportJson();msg('Loaded as new copy')}function save(){let arr=list(KEY),s=makeSong(uniqueName(nameEl.value,arr));arr.unshift(s);localStorage.setItem(KEY,JSON.stringify(arr.slice(0,60)));nameEl.value=s.name;renderSaved();exportJson();msg('Saved new song')}function send(){let arr=list(PIANO),s=makeSong(uniqueName(nameEl.value,arr));arr.unshift(s);localStorage.setItem(PIANO,JSON.stringify(arr.slice(0,60)));save();msg('Added to Piano Tiles')}function removeFrom(k,id){let arr=list(k).filter(s=>s.id!==id);localStorage.setItem(k,JSON.stringify(arr));renderSaved();msg('Removed')}function renderSaved(){let arr=list(KEY);saved.innerHTML='';if(!arr.length){saved.textContent='No saved songs yet.';return}arr.forEach((s,i)=>{let wrap=document.createElement('span');wrap.className='songChip';let b=document.createElement('button');b.className='chip';b.textContent=(s.emoji||'🎵')+' '+(s.name||'Song');b.onclick=()=>load(arr[i]);let x=document.createElement('button');x.className='x';x.textContent='Remove';x.onclick=()=>removeFrom(KEY,s.id);wrap.appendChild(b);wrap.appendChild(x);saved.appendChild(wrap)})}document.getElementById('play').onclick=play;document.getElementById('stop').onclick=stop;document.getElementById('clear').onclick=()=>{pat=Array.from({length:8},()=>Array(16).fill(false));draw();exportJson()};document.getElementById('magic').onclick=()=>{pat=pat.map((r,ri)=>r.map(()=>Math.random()<(ri<4?.22:.14)));draw();exportJson()};document.getElementById('save').onclick=save;document.getElementById('send').onclick=send;document.getElementById('export').onclick=()=>{exportJson();msg('JSON ready')};document.getElementById('loadJson').onclick=()=>{try{load(JSON.parse(jsonBox.value))}catch{msg('Bad JSON')}};document.getElementById('newName').onclick=setFreshName;[nameEl,emojiEl,tempoEl,soundEl].forEach(e=>e.oninput=exportJson);draw();renderSaved();if(!nameEl.value)setFreshName();exportJson();</script></body></html>
