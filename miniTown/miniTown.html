<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mini Town</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#243047;background:linear-gradient(135deg,#dff4ff,#fff3cf 52%,#ffe1ef)}body{min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border-bottom:1px solid rgba(36,48,71,.08);box-shadow:0 12px 40px rgba(36,48,71,.08)}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899);color:white;font-size:24px;box-shadow:0 10px 24px rgba(124,58,237,.25)}h1{font-size:24px;line-height:1;margin:0}.sub{font-size:13px;color:#667085;margin-top:4px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn,.back{border:0;border-radius:999px;background:#243047;color:white;padding:10px 15px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 8px 18px rgba(36,48,71,.18)}.btn.secondary{background:white;color:#243047;border:1px solid #e4e7ec;box-shadow:0 6px 14px rgba(36,48,71,.08)}.stat{background:white;border:1px solid #e4e7ec;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 6px 16px rgba(36,48,71,.08)}.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:18px;min-height:0}.panel{background:rgba(255,255,255,.82);border:1px solid rgba(36,48,71,.08);border-radius:24px;padding:16px;box-shadow:0 18px 45px rgba(36,48,71,.12)}.panel h2{font-size:15px;margin:0 0 10px}.task{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:16px;background:#f8fafc;margin-bottom:8px;font-size:13px;color:#475467}.task.done{background:#eafff3;color:#067647}.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:white;flex:0 0 auto}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.spawn{height:54px;border:1px solid #e4e7ec;border-radius:16px;background:white;font-size:26px;cursor:pointer;box-shadow:0 8px 18px rgba(36,48,71,.08);transition:.16s}.spawn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(36,48,71,.14)}.worldWrap{min-width:0}.world{position:relative;height:min(68vh,640px);min-height:520px;overflow:hidden;border:1px solid rgba(36,48,71,.08);border-radius:30px;background:linear-gradient(#9addff 0 34%,#fff0a8 34% 42%,#69d785 42%);box-shadow:0 24px 60px rgba(36,48,71,.18);isolation:isolate;touch-action:none}.skyGlow{position:absolute;inset:-120px -80px auto auto;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#fff8 0 30%,#fff0 65%)}.road{position:absolute;left:-8%;right:-8%;bottom:70px;height:112px;background:#8792a2;transform:rotate(-2deg);border-top:10px solid #f2f4f7;border-bottom:10px solid #667085}.road:after{content:"";position:absolute;left:0;right:0;top:45px;height:8px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 78px);opacity:.9}.zone{position:absolute;border-radius:24px;border:4px solid rgba(255,255,255,.75);box-shadow:0 12px 28px rgba(36,48,71,.16);display:grid;place-items:end center;padding-bottom:10px;font-weight:900;color:#243047;text-shadow:0 1px 0 #fff}.home{left:5%;bottom:160px;width:210px;height:170px;background:linear-gradient(#ffc8d8,#ff9fbd)}.home:before{content:"";position:absolute;left:24px;right:24px;top:-70px;border-left:78px solid transparent;border-right:78px solid transparent;border-bottom:78px solid #ff4f8b}.home:after{content:"";position:absolute;bottom:0;left:82px;width:52px;height:82px;background:#7c3aed;border-radius:24px 24px 0 0;box-shadow:inset 0 0 0 5px #fff5}.cafe{right:5%;bottom:170px;width:240px;height:150px;background:linear-gradient(#fff7ad,#ffd166)}.cafe:before{content:"TINY CAFE";position:absolute;top:-44px;left:34px;right:34px;background:white;border:3px solid #ffd166;border-radius:18px;padding:8px 10px}.park{left:38%;bottom:145px;width:230px;height:132px;background:linear-gradient(#b7f7c5,#4ade80);border-radius:55% 45% 50% 40%}.fountain{position:absolute;left:45%;top:48%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#dff4ff 0 35%,#60c9ff 36% 62%,#fff 63%);box-shadow:0 12px 26px rgba(36,48,71,.16)}.tree{position:absolute;width:70px;height:110px;bottom:210px}.tree:before{content:"";position:absolute;left:28px;bottom:0;width:18px;height:62px;background:#9a5a28;border-radius:9px}.tree:after{content:"";position:absolute;left:0;top:0;width:74px;height:74px;border-radius:50%;background:#22c55e;box-shadow:18px 18px 0 #16a34a}.tree.one{left:27%}.tree.two{right:31%;transform:scale(.82)}.item{position:absolute;width:62px;height:62px;border-radius:22px;display:grid;place-items:center;font-size:35px;cursor:grab;user-select:none;background:rgba(255,255,255,.9);border:3px solid white;box-shadow:0 12px 26px rgba(36,48,71,.2);transition:box-shadow .15s,transform .15s;z-index:8}.item:active,.item.dragging{cursor:grabbing;transform:scale(1.08);box-shadow:0 18px 38px rgba(36,48,71,.28)}.label{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:10px;font-weight:900;background:#243047;color:white;border-radius:999px;padding:3px 7px;white-space:nowrap}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(255,255,255,.94);border:1px solid #e4e7ec;padding:10px 16px;border-radius:999px;font-weight:900;box-shadow:0 12px 26px rgba(36,48,71,.16);z-index:20}.footer{padding:0 18px 18px;color:#667085;text-align:center;font-size:13px}.coin{position:absolute;font-size:22px;animation:pop .75s ease forwards;pointer-events:none;z-index:30}@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-60px) scale(1.15);opacity:0}}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{order:2}.world{height:560px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}}@media(max-width:600px){.layout{padding:10px}.world{min-height:480px;border-radius:24px}.home{width:160px;height:135px}.cafe{width:170px;height:126px}.park{left:32%;width:180px}.item{width:56px;height:56px;font-size:31px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo">🏘️</div><div><h1>Mini Town</h1><div class="sub">A polished drag-and-play town builder</div></div></div><div class="actions"><span class="stat">Coins: <span id="coins">0</span></span><a class="back" href="../index.html">Back</a><button class="btn secondary" id="reset">Reset Town</button></div></header>
<div class="layout">
<aside class="panel"><h2>Town Goals</h2><div id="tasks"></div><h2>Add Props</h2><div class="catalog"><button class="spawn" data-emoji="🎈" data-name="Balloon">🎈</button><button class="spawn" data-emoji="🍦" data-name="Ice Cream">🍦</button><button class="spawn" data-emoji="⚽" data-name="Soccer Ball">⚽</button><button class="spawn" data-emoji="🌻" data-name="Flower">🌻</button><button class="spawn" data-emoji="🚲" data-name="Bike">🚲</button><button class="spawn" data-emoji="🧁" data-name="Cupcake">🧁</button></div></aside>
<section class="worldWrap"><div class="world" id="world"><div class="skyGlow"></div><div class="toast" id="toast">Drag neighbors into the town zones</div><div class="tree one"></div><div class="tree two"></div><div class="zone home" data-zone="home">Home</div><div class="zone park" data-zone="park">Park</div><div class="zone cafe" data-zone="cafe">Cafe</div><div class="fountain"></div><div class="road"></div></div></section>
</div>
<div class="footer">Tip: drag characters into Home, Park, or Cafe. Add props from the toolbar to make the town feel alive.</div>
</div>
<script>
const world=document.getElementById('world'),toast=document.getElementById('toast'),coinsEl=document.getElementById('coins'),tasksEl=document.getElementById('tasks');
let drag=null,dx=0,dy=0,coins=0,itemId=0;
const starting=[['🧒','Milo',46,46],['👧','Ava',56,52],['🐶','Biscuit',66,61],['👵','Nana',28,58],['🧑‍🍳','Chef',75,36],['🐱','Mochi',18,50]];
const goals=[{id:'home',text:'Bring any neighbor home',done:false},{id:'park',text:'Take a friend to the park',done:false},{id:'cafe',text:'Visit the tiny cafe',done:false},{id:'props',text:'Add three new props',done:false,count:0}];
function renderTasks(){tasksEl.innerHTML=goals.map(g=>`<div class="task ${g.done?'done':''}"><span class="dot">${g.done?'✓':'•'}</span><span>${g.text}</span></div>`).join('')}
function say(text){toast.textContent=text;clearTimeout(say.t);say.t=setTimeout(()=>toast.textContent='Keep building your mini town',2200)}
function coinAt(x,y){coins++;coinsEl.textContent=coins;const c=document.createElement('div');c.className='coin';c.textContent='🪙';c.style.left=x+'px';c.style.top=y+'px';world.appendChild(c);setTimeout(()=>c.remove(),800)}
function createItem(emoji,name,left,top){const item=document.createElement('div');item.className='item';item.dataset.name=name;item.dataset.id=++itemId;item.innerHTML=`<span class="label">${name}</span>${emoji}`;item.style.left=left+'%';item.style.top=top+'%';world.appendChild(item);return item}
function reset(){world.querySelectorAll('.item,.coin').forEach(e=>e.remove());coins=0;itemId=0;coinsEl.textContent=0;goals.forEach(g=>{g.done=false;if(g.id==='props')g.count=0});starting.forEach(p=>createItem(...p));renderTasks();say('Drag neighbors into the town zones')}
function getPoint(e){return e.touches?e.touches[0]:e}
function start(e){const t=e.target.closest('.item');if(!t)return;drag=t;drag.classList.add('dragging');const p=getPoint(e),r=t.getBoundingClientRect();dx=p.clientX-r.left;dy=p.clientY-r.top;t.style.zIndex=Date.now();}
function move(e){if(!drag)return;e.preventDefault();const p=getPoint(e),wr=world.getBoundingClientRect();const x=Math.max(0,Math.min(wr.width-drag.offsetWidth,p.clientX-wr.left-dx));const y=Math.max(0,Math.min(wr.height-drag.offsetHeight,p.clientY-wr.top-dy));drag.style.left=x+'px';drag.style.top=y+'px';}
function center(el){const a=el.getBoundingClientRect(),w=world.getBoundingClientRect();return{x:a.left+a.width/2-w.left,y:a.top+a.height/2-w.top}}
function inside(item,zone){const a=item.getBoundingClientRect(),b=zone.getBoundingClientRect();const x=a.left+a.width/2,y=a.top+a.height/2;return x>b.left&&x<b.right&&y>b.top&&y<b.bottom}
function checkGoals(item){const zones=[...world.querySelectorAll('.zone')];zones.forEach(z=>{if(inside(item,z)){const g=goals.find(v=>v.id===z.dataset.zone);if(g&&!g.done){g.done=true;const p=center(item);coinAt(p.x,p.y);say(`${item.dataset.name} visited ${z.textContent}!`);renderTasks()}}})}
function end(){if(!drag)return;drag.classList.remove('dragging');checkGoals(drag);drag=null}
world.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);world.addEventListener('touchstart',start,{passive:false});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end);
document.querySelectorAll('.spawn').forEach(b=>b.onclick=()=>{const item=createItem(b.dataset.emoji,b.dataset.name,42+Math.random()*18,34+Math.random()*22);goals.find(g=>g.id==='props').count++;const propGoal=goals.find(g=>g.id==='props');if(propGoal.count>=3&&!propGoal.done){propGoal.done=true;const p=center(item);coinAt(p.x,p.y);say('The town feels more alive!');renderTasks()}else say(`${b.dataset.name} added to town`)});
document.getElementById('reset').onclick=reset;reset();
</script>
</body>
</html>
