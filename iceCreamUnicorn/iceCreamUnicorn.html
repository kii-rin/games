<div id="ic2-wrap" style="width:100%;display:flex;flex-direction:column;align-items:center;padding:1rem 0;font-family:var(--font-sans)">
  <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;margin-bottom:8px;font-size:14px;color:var(--color-text-secondary);gap:8px;flex-wrap:wrap">
    <div>Score: <span id="ic2-score" style="color:var(--color-text-primary);font-weight:500">0</span></div>
    <div>Level: <span id="ic2-level" style="color:var(--color-text-primary);font-weight:500">1</span></div>
    <div>Stack: <span id="ic2-stack" style="color:var(--color-text-primary);font-weight:500">0</span></div>
    <div>Lives: <span id="ic2-lives" style="color:var(--color-text-primary);font-weight:500">3</span></div>
  </div>
  <div id="ic2-canvas-host" style="width:100%;max-width:520px;aspect-ratio:13/14;background:linear-gradient(180deg,#FFE0F0 0%,#FFE8F0 60%,#FFF4E6 100%);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);overflow:hidden;position:relative;touch-action:none">
    <div id="ic2-msg" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.92);border:2px solid #FF8FB1;color:#7A3550;padding:10px 18px;border-radius:12px;font-weight:500;font-size:15px;pointer-events:none;opacity:0;transition:opacity 0.2s;text-align:center"></div>
    <button id="ic2-end-btn" style="position:absolute;top:8px;right:8px;padding:6px 12px;font-size:12px;background:rgba(255,255,255,0.85);border:0.5px solid var(--color-border-secondary);border-radius:8px;cursor:pointer;color:#7A3550;font-weight:500">End run 🐦</button>
  </div>
  <div style="margin-top:10px;font-size:13px;color:var(--color-text-secondary);text-align:center;max-width:520px">
    Move with ← → / A D or drag. Camera zooms out as your tower grows. Hit "End run" to unleash the bird swarm finale!
  </div>
  <div id="ic2-overlay" style="margin-top:10px;width:100%;max-width:520px"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const host=document.getElementById('ic2-canvas-host');
  const scoreEl=document.getElementById('ic2-score');
  const levelEl=document.getElementById('ic2-level');
  const stackEl=document.getElementById('ic2-stack');
  const livesEl=document.getElementById('ic2-lives');
  const msgEl=document.getElementById('ic2-msg');
  const overlay=document.getElementById('ic2-overlay');
  const endBtn=document.getElementById('ic2-end-btn');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xFFE0F0);
  scene.fog=new THREE.Fog(0xFFE0F0,30,80);

  const camera=new THREE.PerspectiveCamera(55,1,0.1,200);
  camera.position.set(0,5.5,13);
  camera.lookAt(0,2,0);

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(window.devicePixelRatio||1);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);
  renderer.domElement.style.display='block';
  renderer.domElement.style.width='100%';
  renderer.domElement.style.height='100%';

  function resize(){
    const r=host.getBoundingClientRect();
    renderer.setSize(r.width,r.height,false);
    camera.aspect=r.width/r.height;
    camera.updateProjectionMatrix();
  }
  resize();
  new ResizeObserver(resize).observe(host);

  // Lights
  scene.add(new THREE.AmbientLight(0xFFFFFF,0.75));
  const sun=new THREE.DirectionalLight(0xFFF4CC,0.9);
  sun.position.set(6,18,6);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-15;sun.shadow.camera.right=15;
  sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;
  scene.add(sun);

  // Ground
  const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),new THREE.MeshLambertMaterial({color:0xC8E6C9}));
  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);
  // Path
  const path=new THREE.Mesh(new THREE.PlaneGeometry(7,40),new THREE.MeshLambertMaterial({color:0xFFE0B2}));
  path.rotation.x=-Math.PI/2;
  path.position.y=0.01;
  path.receiveShadow=true;
  scene.add(path);

  function addBush(x,z,c){
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.7,12,8),new THREE.MeshLambertMaterial({color:c}));
    b.position.set(x,0.55,z);b.castShadow=true;scene.add(b);
  }
  for(let i=0;i<14;i++){
    const side=i%2===0?-1:1;
    addBush(side*(5+Math.random()*3),-12+i*2,[0xA5D6A7,0xC5E1A5,0xAED581][i%3]);
  }

  // --- UNICORN BUILDER ---
  function makeUnicorn(scale){
    const g=new THREE.Group();
    const bodyColor=[0xFFFFFF,0xFFE0F0,0xE6E0FF,0xFFF0E0][Math.floor(Math.random()*4)];
    const maneColors=[0xFF8FB1,0xA29BFE,0x7ED6DF,0xFFD93D];
    // body
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.7,14,10),new THREE.MeshLambertMaterial({color:bodyColor}));
    body.scale.set(1.3,0.85,0.9);
    body.castShadow=true;
    g.add(body);
    // head
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.45,12,10),new THREE.MeshLambertMaterial({color:bodyColor}));
    head.position.set(0.85,0.45,0);
    head.scale.set(1,0.9,0.9);
    head.castShadow=true;
    g.add(head);
    // snout
    const snout=new THREE.Mesh(new THREE.SphereGeometry(0.25,10,8),new THREE.MeshLambertMaterial({color:0xFFE0F0}));
    snout.position.set(1.2,0.3,0);
    g.add(snout);
    // horn (rainbow!)
    for(let i=0;i<4;i++){
      const ring=new THREE.Mesh(
        new THREE.CylinderGeometry(0.06-i*0.012,0.08-i*0.012,0.1,8),
        new THREE.MeshLambertMaterial({color:[0xFF6B9D,0xFFD93D,0x7ED6DF,0xA29BFE][i]})
      );
      ring.position.set(0.85,0.85+i*0.1,0);
      g.add(ring);
    }
    // legs
    for(let i=0;i<4;i++){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.55,8),new THREE.MeshLambertMaterial({color:bodyColor}));
      leg.position.set(i<2?-0.4:0.4,-0.4,i%2===0?-0.3:0.3);
      leg.castShadow=true;
      g.add(leg);
    }
    // mane (multiple colored tufts)
    for(let i=0;i<5;i++){
      const tuft=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),new THREE.MeshLambertMaterial({color:maneColors[i%4]}));
      tuft.position.set(0.4-i*0.15,0.55-i*0.05,0);
      tuft.scale.set(0.9,1.1,0.7);
      g.add(tuft);
    }
    // tail
    for(let i=0;i<4;i++){
      const ttuft=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,6),new THREE.MeshLambertMaterial({color:maneColors[i%4]}));
      ttuft.position.set(-0.95-i*0.1,0.1-i*0.1,0);
      g.add(ttuft);
    }
    // eyes
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),new THREE.MeshBasicMaterial({color:0x222222}));
    eye.position.set(1.05,0.5,0.28);g.add(eye);
    const eye2=eye.clone();eye2.position.z=-0.28;g.add(eye2);
    // cheek
    const cheek=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),new THREE.MeshBasicMaterial({color:0xFF9EC0}));
    cheek.position.set(1.1,0.3,0.3);g.add(cheek);
    const cheek2=cheek.clone();cheek2.position.z=-0.3;g.add(cheek2);
    // wings (little)
    const wing=new THREE.Mesh(new THREE.SphereGeometry(0.3,10,6),new THREE.MeshLambertMaterial({color:0xFFFFFF,transparent:true,opacity:0.85}));
    wing.scale.set(0.4,1,1.4);
    wing.position.set(0,0.5,0.6);
    g.add(wing);
    const wing2=wing.clone();wing2.position.z=-0.6;g.add(wing2);
    g.userData.wingL=wing;g.userData.wingR=wing2;

    g.scale.setScalar(scale||0.6);
    return g;
  }

  // Sprinkle unicorns around the meadow
  const unicorns=[];
  for(let i=0;i<10;i++){
    const u=makeUnicorn(0.55+Math.random()*0.25);
    const angle=Math.random()*Math.PI*2;
    const r=7+Math.random()*15;
    u.position.set(Math.cos(angle)*r, 0.55, Math.sin(angle)*r - 4);
    u.rotation.y=Math.random()*Math.PI*2;
    u.userData.phase=Math.random()*Math.PI*2;
    u.userData.baseY=u.position.y;
    scene.add(u);
    unicorns.push(u);
  }

  // Sparkle stars
  const sparkles=[];
  for(let i=0;i<30;i++){
    const s=new THREE.Mesh(
      new THREE.OctahedronGeometry(0.12,0),
      new THREE.MeshBasicMaterial({color:[0xFFD93D,0xFF8FB1,0x7ED6DF,0xA29BFE,0xFFFFFF][i%5]})
    );
    s.position.set((Math.random()-0.5)*30,1+Math.random()*8,(Math.random()-0.5)*25-5);
    s.userData.phase=Math.random()*Math.PI*2;
    s.userData.baseY=s.position.y;
    scene.add(s);
    sparkles.push(s);
  }

  // Rainbow arch in distance
  for(let i=0;i<6;i++){
    const arch=new THREE.Mesh(
      new THREE.TorusGeometry(8-i*0.6,0.25,8,32,Math.PI),
      new THREE.MeshBasicMaterial({color:[0xE57373,0xFFB347,0xFFD93D,0x81C784,0x64B5F6,0xBA68C8][i]})
    );
    arch.position.set(0,0,-20);
    arch.rotation.z=0;
    scene.add(arch);
  }

  // Player (cute cone)
  const player=new THREE.Group();
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.6,16),new THREE.MeshLambertMaterial({color:0xE6A972}));
  cone.rotation.x=Math.PI;cone.position.y=0.8;cone.castShadow=true;
  player.add(cone);
  for(let i=0;i<4;i++){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.45-i*0.08,0.03,6,12),new THREE.MeshLambertMaterial({color:0xB07045}));
    ring.rotation.x=Math.PI/2;ring.position.y=0.2+i*0.35;
    player.add(ring);
  }
  const eL=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),new THREE.MeshBasicMaterial({color:0x222}));
  eL.position.set(-0.18,1.0,0.55);player.add(eL);
  const eR=eL.clone();eR.position.x=0.18;player.add(eR);
  const chL=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),new THREE.MeshBasicMaterial({color:0xFF9EC0}));
  chL.position.set(-0.3,0.85,0.5);player.add(chL);
  const chR=chL.clone();chR.position.x=0.3;player.add(chR);

  const stackGroup=new THREE.Group();
  stackGroup.position.y=1.7;
  player.add(stackGroup);

  player.position.set(0,0,2);
  scene.add(player);

  const flavors=[
    {name:'Strawberry',color:0xFF8FB1},
    {name:'Mint',color:0x7ED6DF},
    {name:'Blueberry',color:0xA29BFE},
    {name:'Mango',color:0xFFB347},
    {name:'Chocolate',color:0x8B5A3C},
    {name:'Matcha',color:0xB6D962},
    {name:'Bubblegum',color:0xFF6FB5},
    {name:'Vanilla',color:0xFFF5C2}
  ];

  function makeScoopMesh(color){
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,12),new THREE.MeshLambertMaterial({color}));
    mesh.castShadow=true;
    const spr=new THREE.Group();
    for(let i=0;i<6;i++){
      const s=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.04,0.04),new THREE.MeshBasicMaterial({color:[0xFFFFFF,0xFFD93D,0xFF6B9D,0x7ED6DF][i%4]}));
      const a=(i/6)*Math.PI*2;
      s.position.set(Math.cos(a)*0.4,0.25+Math.random()*0.15,Math.sin(a)*0.4);
      s.rotation.set(Math.random(),Math.random(),Math.random());
      spr.add(s);
    }
    mesh.add(spr);
    return mesh;
  }

  function makeBird(){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.45,14,10),new THREE.MeshLambertMaterial({color:0xE57373}));
    body.castShadow=true;g.add(body);
    const belly=new THREE.Mesh(new THREE.SphereGeometry(0.32,12,8),new THREE.MeshLambertMaterial({color:0xFFCDD2}));
    belly.position.set(0,-0.08,0.2);g.add(belly);
    const wingMat=new THREE.MeshLambertMaterial({color:0xC62828});
    const wL=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.35),wingMat);wL.position.set(-0.4,0.1,0);g.add(wL);
    const wR=wL.clone();wR.position.x=0.4;g.add(wR);
    g.userData.wingL=wL;g.userData.wingR=wR;
    const beak=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.3,8),new THREE.MeshLambertMaterial({color:0xFFA726}));
    beak.rotation.x=Math.PI/2;beak.position.set(0,0,0.55);g.add(beak);
    const eg=new THREE.SphereGeometry(0.08,8,8),em=new THREE.MeshBasicMaterial({color:0xFFFFFF});
    const elf=new THREE.Mesh(eg,em);elf.position.set(-0.15,0.15,0.35);g.add(elf);
    const erf=new THREE.Mesh(eg,em);erf.position.set(0.15,0.15,0.35);g.add(erf);
    return g;
  }

  function makeCloud(x,y,z){
    const g=new THREE.Group();
    const m=new THREE.MeshLambertMaterial({color:0xFFFFFF});
    [[0,0,0,0.9],[0.8,0.1,0,0.7],[-0.8,0.1,0,0.7],[0.3,0.4,0,0.5]].forEach(p=>{
      const s=new THREE.Mesh(new THREE.SphereGeometry(p[3],10,8),m);s.position.set(p[0],p[1],p[2]);g.add(s);
    });
    g.position.set(x,y,z);scene.add(g);return g;
  }
  const clouds=[];
  for(let i=0;i<6;i++)clouds.push(makeCloud(-10+i*4,8+Math.random()*4,-6-Math.random()*10));

  const state={
    targetX:0,
    scoops:[], birds:[], stack:[], particles:[],
    score:0, level:1, lives:3, tallest:0,
    spawnT:30, birdT:140,
    running:true, dragging:false,
    keys:{},
    finale:false, finaleT:0
  };

  function flash(text,ms=1400){
    msgEl.textContent=text;
    msgEl.style.opacity='1';
    clearTimeout(msgEl._t);
    msgEl._t=setTimeout(()=>{msgEl.style.opacity='0'},ms);
  }

  function spawnScoop(){
    const f=flavors[Math.floor(Math.random()*flavors.length)];
    const mesh=makeScoopMesh(f.color);
    mesh.position.set((Math.random()-0.5)*5.5,12+state.stack.length*0.6+Math.random()*2,2);
    scene.add(mesh);
    state.scoops.push({mesh,vy:-0.07-Math.random()*0.02-state.level*0.012,color:f.color,spin:Math.random()*0.1});
  }
  function spawnBird(extraSpeed){
    const b=makeBird();
    const side=Math.random()<0.5?-1:1;
    const targetY=2+state.stack.length*0.55+Math.random()*2;
    b.position.set(side*9,targetY,2);
    b.userData.t=Math.random()*Math.PI*2;
    scene.add(b);
    state.birds.push({mesh:b,vx:-side*(0.06+state.level*0.015+(extraSpeed||0)),baseY:b.position.y,dead:false});
  }

  function updateStackVisual(){
    while(stackGroup.children.length>state.stack.length){
      stackGroup.remove(stackGroup.children.pop());
    }
    while(stackGroup.children.length<state.stack.length){
      const idx=stackGroup.children.length;
      const m=makeScoopMesh(state.stack[idx]);
      m.position.y=idx*0.55;
      m.scale.setScalar(0.85);
      stackGroup.add(m);
    }
    if(state.stack.length>3){
      const top=stackGroup.children[stackGroup.children.length-1];
      if(top && !top.userData.cherry){
        const cherry=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,8),new THREE.MeshLambertMaterial({color:0xE53935}));
        cherry.position.y=0.5;top.add(cherry);
        const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.2),new THREE.MeshLambertMaterial({color:0x4CAF50}));
        stem.position.y=0.7;stem.rotation.z=0.3;top.add(stem);
        top.userData.cherry=true;
      }
    }
    stackEl.textContent=state.stack.length;
  }

  function popParticles(x,y,z,color){
    for(let i=0;i<14;i++){
      const p=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),new THREE.MeshBasicMaterial({color}));
      p.position.set(x,y,z);
      const v=new THREE.Vector3((Math.random()-0.5)*0.2,Math.random()*0.2+0.1,(Math.random()-0.5)*0.2);
      scene.add(p);
      state.particles.push({mesh:p,v,life:40});
    }
  }

  function levelUp(){
    state.level++;
    levelEl.textContent=state.level;
    flash('Level '+state.level+'!');
  }

  // Input
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))state.keys[e.key]=true});
  window.addEventListener('keyup',e=>{state.keys[e.key]=false});
  function pointerX(clientX){
    const r=host.getBoundingClientRect();
    const nx=((clientX-r.left)/r.width)*2-1;
    state.targetX=nx*3.2;
  }
  host.addEventListener('mousedown',e=>{state.dragging=true;pointerX(e.clientX)});
  host.addEventListener('mousemove',e=>{if(state.dragging)pointerX(e.clientX)});
  window.addEventListener('mouseup',()=>state.dragging=false);
  host.addEventListener('touchstart',e=>{state.dragging=true;pointerX(e.touches[0].clientX);e.preventDefault()},{passive:false});
  host.addEventListener('touchmove',e=>{pointerX(e.touches[0].clientX);e.preventDefault()},{passive:false});
  host.addEventListener('touchend',()=>state.dragging=false);

  endBtn.addEventListener('click',()=>{
    if(!state.running||state.finale)return;
    if(state.stack.length===0){flash('Catch some scoops first!');return}
    state.finale=true;
    state.finaleT=0;
    flash('🐦 BIRD SWARM INCOMING! 🐦',2200);
  });

  function distXY(a,b){const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;return Math.sqrt(dx*dx+dy*dy+dz*dz)}

  function update(){
    if(!state.running)return;
    if(state.keys['ArrowLeft']||state.keys['a']||state.keys['A'])state.targetX-=0.15;
    if(state.keys['ArrowRight']||state.keys['d']||state.keys['D'])state.targetX+=0.15;
    state.targetX=Math.max(-3.2,Math.min(3.2,state.targetX));
    player.position.x+=(state.targetX-player.position.x)*0.18;
    player.rotation.z=-(state.targetX-player.position.x)*0.3;

    // === FINALE MODE: bird swarm eats everything ===
    if(state.finale){
      state.finaleT++;
      // spawn lots of birds rapidly
      if(state.finaleT%6===0)spawnBird(0.05);
      if(state.finaleT>600){
        // peaceful end
        state.finale=false;
        flash('What a feast!',2000);
      }
    } else {
      state.spawnT--;
      if(state.spawnT<=0){spawnScoop();state.spawnT=Math.max(25,75-state.level*5)}
      state.birdT--;
      if(state.birdT<=0){spawnBird();state.birdT=Math.max(50,160-state.level*10)}
    }

    const stackTopY=player.position.y+1.7+state.stack.length*0.55;
    const catchPos={x:player.position.x,y:stackTopY,z:player.position.z};

    // scoops fall
    for(let i=state.scoops.length-1;i>=0;i--){
      const s=state.scoops[i];
      s.mesh.position.y+=s.vy;
      s.mesh.rotation.y+=s.spin;
      const d=distXY(s.mesh.position,catchPos);
      if(d<0.8 && s.mesh.position.y<stackTopY+0.5 && !state.finale){
        state.score+=10;scoreEl.textContent=state.score;
        state.stack.push(s.color);
        updateStackVisual();
        popParticles(s.mesh.position.x,s.mesh.position.y,s.mesh.position.z,s.color);
        scene.remove(s.mesh);state.scoops.splice(i,1);
        if(state.score>0 && state.score%80===0)levelUp();
        continue;
      }
      if(s.mesh.position.y<-0.5){scene.remove(s.mesh);state.scoops.splice(i,1)}
    }

    // birds
    for(let i=state.birds.length-1;i>=0;i--){
      const b=state.birds[i];
      b.mesh.position.x+=b.vx;
      b.mesh.userData.t+=0.08;
      b.mesh.position.y=b.baseY+Math.sin(b.mesh.userData.t)*0.4;
      const flap=Math.sin(b.mesh.userData.t*3)*0.6;
      b.mesh.userData.wingL.rotation.z=flap;
      b.mesh.userData.wingR.rotation.z=-flap;
      b.mesh.rotation.y=b.vx<0?Math.PI/2:-Math.PI/2;
      // dive at top of stack
      if(state.stack.length>0){
        const target=stackTopY+0.2;
        const speedFactor=state.finale?0.04:0.005*state.level;
        b.mesh.position.y+=(target-b.mesh.position.y)*speedFactor;
        // x homing in finale
        if(state.finale){
          if(player.position.x<b.mesh.position.x)b.mesh.position.x-=0.05;
          else b.mesh.position.x+=0.05;
        } else if(state.level>=2){
          if(player.position.x<b.mesh.position.x)b.mesh.position.x-=0.01*state.level;
          else b.mesh.position.x+=0.01*state.level;
        }
        const dx=Math.abs(b.mesh.position.x-player.position.x);
        const dy=Math.abs(b.mesh.position.y-stackTopY);
        if(dx<0.7 && dy<0.7){
          const stolen=state.stack.pop();
          updateStackVisual();
          popParticles(b.mesh.position.x,b.mesh.position.y,b.mesh.position.z,stolen);
          if(!state.finale)flash('A bird stole a scoop!',900);
          b.mesh.position.y+=0.5;b.vx*=-1.5;b.baseY+=1;
          if(state.stack.length===0 && !state.finale){
            state.lives--;livesEl.textContent=state.lives;
            if(state.lives<=0){gameOver();return}
            flash('Lost a life!',1200);
          }
        }
      }
      if(b.mesh.position.x<-11||b.mesh.position.x>11||b.mesh.position.y>30){
        scene.remove(b.mesh);state.birds.splice(i,1);
      }
    }

    // particles
    for(let i=state.particles.length-1;i>=0;i--){
      const p=state.particles[i];
      p.mesh.position.x+=p.v.x;p.mesh.position.y+=p.v.y;p.mesh.position.z+=p.v.z;
      p.v.y-=0.015;p.life--;
      if(p.life<=0){scene.remove(p.mesh);state.particles.splice(i,1)}
    }

    // unicorns gently bob & trot
    unicorns.forEach((u,i)=>{
      u.userData.phase+=0.04;
      u.position.y=u.userData.baseY+Math.abs(Math.sin(u.userData.phase))*0.15;
      u.rotation.y+=0.003*(i%2===0?1:-1);
      if(u.userData.wingL){
        const f=Math.sin(u.userData.phase*2)*0.4;
        u.userData.wingL.rotation.x=f;
        u.userData.wingR.rotation.x=-f;
      }
    });
    // sparkles spin
    sparkles.forEach(s=>{
      s.userData.phase+=0.05;
      s.rotation.y+=0.05;
      s.rotation.x+=0.03;
      s.position.y=s.userData.baseY+Math.sin(s.userData.phase)*0.3;
    });

    clouds.forEach(c=>{c.position.x+=0.005;if(c.position.x>12)c.position.x=-12});
    player.position.y=Math.abs(Math.sin(Date.now()*0.005))*0.05;

    // === CAMERA AUTO-ZOOM to fit player + full stack ===
    const stackHeight=1.7+state.stack.length*0.55+1;
    const desiredCamY=Math.max(5.5, stackHeight*0.55+3);
    const desiredCamZ=Math.max(13, 11+stackHeight*0.55);
    const lookAtY=stackHeight*0.5;
    camera.position.y+=(desiredCamY-camera.position.y)*0.05;
    camera.position.z+=(desiredCamZ-camera.position.z)*0.05;
    camera.position.x+=(player.position.x*0.3-camera.position.x)*0.05;
    camera.lookAt(player.position.x*0.5,lookAtY,0);
  }

  function gameOver(){
    state.running=false;
    overlay.innerHTML='<div style="text-align:center;padding:14px 16px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-size:14px"><div style="font-weight:500;font-size:16px;margin-bottom:6px">Sweet adventure ended! 🦄</div><div style="color:var(--color-text-secondary);margin-bottom:10px">Final score: '+state.score+' &middot; Level '+state.level+' &middot; Tallest tower: '+state.tallest+'</div><button id="ic2-restart" style="padding:8px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:14px;cursor:pointer">Play again</button></div>';
    document.getElementById('ic2-restart').onclick=restart;
  }
  function restart(){
    state.scoops.forEach(s=>scene.remove(s.mesh));
    state.birds.forEach(b=>scene.remove(b.mesh));
    state.particles.forEach(p=>scene.remove(p.mesh));
    state.scoops=[];state.birds=[];state.particles=[];state.stack=[];
    state.score=0;state.level=1;state.lives=3;state.tallest=0;
    state.spawnT=30;state.birdT=140;state.running=true;
    state.finale=false;state.finaleT=0;state.targetX=0;
    scoreEl.textContent=0;levelEl.textContent=1;livesEl.textContent=3;
    updateStackVisual();
    overlay.innerHTML='';
  }

  function loop(){
    update();
    if(state.stack.length>state.tallest)state.tallest=state.stack.length;
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
