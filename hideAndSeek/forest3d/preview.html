<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hide & Seek — forest asset pass 01</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#a9dcff,#e8f7e1);font-family:system-ui,sans-serif;color:#173a2c}canvas{display:block;width:100%;height:100%}.tag{position:fixed;z-index:2;left:14px;top:14px;padding:9px 12px;border-radius:999px;background:#ffffffd9;box-shadow:0 8px 20px #0002;font-weight:750;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div class="tag">Hide & Seek · forest assets pass 01</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {buildForestPrototypeLibrary,FOREST_ASSET_IDS} from './forestAssetFactory.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xdff2df,12,30);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(8,7,10);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x4f7d47,2.2));const sun=new THREE.DirectionalLight(0xfff3dc,2);sun.position.set(5,8,4);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(11,48),new THREE.MeshLambertMaterial({color:0x74c95f}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const lib=buildForestPrototypeLibrary();FOREST_ASSET_IDS.forEach((id,i)=>{const a=i/FOREST_ASSET_IDS.length*Math.PI*2,r=id==='friend_placeholder'?0:5.4,o=lib[id].clone(true);o.position.set(Math.cos(a)*r,0,Math.sin(a)*r);o.rotation.y=-a+Math.PI/2;scene.add(o)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
