2<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mushroom Kingdom Grand Prix</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#7ec0ee;
    --grass:#4ec24e;
    --grass-dk:#3aa83a;
    --road:#5a5a6e;
    --road-edge:#ffd23f;
    --pipe:#2bb24c;
    --red:#e52521;
    --yellow:#fbd000;
    --blue:#049cd8;
    --brick:#b9521b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:'Bungee',sans-serif;color:#fff;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at top, #7ec0ee 0%, #4a90c2 60%, #2a5a8a 100%);
    image-rendering:pixelated;
  }
  /* clouds in background */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 80px 30px at 10% 15%, #fff 40%, transparent 42%),
      radial-gradient(ellipse 120px 40px at 80% 25%, #fff 40%, transparent 42%),
      radial-gradient(ellipse 60px 25px at 50% 8%, #fff 40%, transparent 42%),
      radial-gradient(ellipse 100px 35px at 30% 35%, #fff 40%, transparent 42%);
    opacity:.7;
    animation:drift 60s linear infinite;
  }
  @keyframes drift{from{transform:translateX(-5%);}to{transform:translateX(5%);}}

  #game{
    position:relative;
    width:min(95vw, 900px);
    aspect-ratio: 9/10;
    max-height:95vh;
    background:var(--grass);
    border:6px solid #1a1a2e;
    border-radius:12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 0 3px #fff;
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}

  /* HUD */
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:12px 16px;pointer-events:none;
    font-family:'Press Start 2P',monospace;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    z-index:5;
  }
  .hud-box{
    background:rgba(0,0,0,.55);
    border:3px solid #fff;
    border-radius:6px;
    padding:8px 12px;
    font-size:11px;
    line-height:1.6;
  }
  #hud .label{color:var(--yellow);}
  #speedo{color:#fff;}
  #lap{color:#fff;}
  #time{color:#fff;}
  #pos{color:#fff;}

  /* screens */
  .screen{
    position:absolute;inset:0;
    background:rgba(10,10,30,.92);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    z-index:20;text-align:center;padding:20px;
    backdrop-filter: blur(4px);
  }
  .screen.hidden{display:none;}
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(16px, 3.2vw, 28px);
    color:var(--yellow);
    text-shadow: 3px 3px 0 var(--red), 6px 6px 0 #000;
    margin-bottom:6px;
    letter-spacing:1px;
  }
  h2{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(11px, 1.6vw, 15px);
    color:#fff;
    margin-bottom:24px;
    opacity:.9;
  }
  .chars{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    max-width:640px;width:100%;
    margin-bottom:18px;
  }
  .char{
    cursor:pointer;
    background:#1a1a3e;
    border:4px solid #555;
    border-radius:10px;
    padding:10px 6px 8px;
    transition:transform .12s, border-color .12s, background .12s;
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    color:#fff;
  }
  .char:hover{transform:translateY(-3px);border-color:#fff;background:#2a2a5e;}
  .char.selected{
    border-color:var(--yellow);
    background:#3a3a1e;
    box-shadow:0 0 20px var(--yellow);
    transform:translateY(-3px);
  }
  .char .sprite{
    width:64px;height:64px;margin:0 auto 8px;
    image-rendering:pixelated;
  }
  .char .name{margin-bottom:4px;letter-spacing:.5px;}
  .char .stats{font-size:7px;opacity:.7;line-height:1.5;}

  button.cta{
    font-family:'Press Start 2P',monospace;
    font-size:13px;
    padding:14px 28px;
    background:linear-gradient(180deg, var(--red) 0%, #b01818 100%);
    color:#fff;
    border:4px solid #fff;
    border-radius:8px;
    cursor:pointer;
    text-shadow:2px 2px 0 #000;
    box-shadow: 0 4px 0 #6a0e0e, 0 6px 14px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s;
    letter-spacing:1px;
  }
  button.cta:hover{transform:translateY(-2px);box-shadow:0 6px 0 #6a0e0e, 0 10px 18px rgba(0,0,0,.5);}
  button.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #6a0e0e;}
  button.cta.go{background:linear-gradient(180deg,#3ed24f 0%, #1f8a2e 100%);box-shadow:0 4px 0 #145a1d, 0 6px 14px rgba(0,0,0,.4);}
  button.cta.go:hover{box-shadow:0 6px 0 #145a1d, 0 10px 18px rgba(0,0,0,.5);}
  button.cta.go:active{box-shadow:0 2px 0 #145a1d;}

  .controls{
    margin-top:18px;font-family:'Press Start 2P',monospace;font-size:9px;
    color:#aab;line-height:1.8;letter-spacing:.5px;
  }
  .controls kbd{
    background:#fff;color:#000;padding:3px 7px;border-radius:3px;
    border:2px solid #888;border-bottom-width:3px;font-family:inherit;font-size:9px;
    margin:0 2px;
  }

  /* countdown */
  #countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Press Start 2P',monospace;font-size:clamp(60px,12vw,140px);
    color:var(--yellow);
    text-shadow: 4px 4px 0 var(--red), 8px 8px 0 #000;
    z-index:15;pointer-events:none;opacity:0;
  }
  #countdown.show{animation:popCount .9s ease-out;}
  @keyframes popCount{
    0%{opacity:0;transform:scale(2.5);}
    20%{opacity:1;transform:scale(1);}
    80%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(.6);}
  }

  /* finish banner */
  #finishBanner{
    position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-family:'Press Start 2P',monospace;
    background:linear-gradient(180deg,var(--yellow),#e0a800);
    color:#000;padding:14px 28px;border:4px solid #000;border-radius:8px;
    font-size:clamp(14px,2.5vw,22px);
    text-shadow: 1px 1px 0 #fff;
    z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.5);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  #finishBanner.show{transform:translate(-50%,-50%) scale(1);}

  /* mobile touch controls */
  #touch{
    position:absolute;bottom:0;left:0;right:0;
    display:none;padding:14px;justify-content:space-between;
    pointer-events:none;z-index:6;
  }
  .tbtn{
    pointer-events:auto;
    width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.25);border:3px solid #fff;
    color:#fff;font-family:'Press Start 2P',monospace;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  .tbtn:active{background:rgba(255,255,255,.5);}
  .tgroup{display:flex;gap:10px;}
  @media (hover:none) and (pointer:coarse){
    #touch{display:flex;}
    .controls{display:none;}
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" width="900" height="1000"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">
      <div><span class="label">LAP</span> <span id="lap">1/3</span></div>
      <div><span class="label">TIME</span> <span id="time">0.00</span></div>
    </div>
    <div class="hud-box" style="text-align:right;">
      <div><span class="label">SPEED</span> <span id="speedo">0</span></div>
      <div><span class="label">POS</span> <span id="pos">1/4</span></div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch">
    <div class="tgroup">
      <div class="tbtn" data-key="ArrowLeft">◀</div>
      <div class="tbtn" data-key="ArrowRight">▶</div>
    </div>
    <div class="tgroup">
      <div class="tbtn" data-key="ArrowDown">▼</div>
      <div class="tbtn" data-key="ArrowUp">▲</div>
    </div>
  </div>

  <!-- Countdown -->
  <div id="countdown"></div>

  <!-- Finish banner -->
  <div id="finishBanner"></div>

  <!-- Character select -->
  <div id="selectScreen" class="screen">
    <h1>MUSHROOM KINGDOM GP</h1>
    <h2>Choose Your Racer</h2>
    <div class="chars" id="charGrid"></div>
    <button class="cta go" id="startBtn">START RACE!</button>
    <div class="controls">
      <kbd>↑</kbd> Gas &nbsp; <kbd>↓</kbd> Brake &nbsp; <kbd>←</kbd> <kbd>→</kbd> Steer
    </div>
  </div>

  <!-- Results -->
  <div id="resultScreen" class="screen hidden">
    <h1 id="resultTitle">FINISH!</h1>
    <h2 id="resultSub">Final time: 0.00s</h2>
    <div id="standings" style="font-family:'Press Start 2P',monospace;font-size:11px;line-height:2;margin-bottom:20px;background:rgba(0,0,0,.4);padding:14px 20px;border:3px solid #fff;border-radius:8px;"></div>
    <button class="cta" id="againBtn">RACE AGAIN</button>
  </div>
</div>

<script>
/* ============================================
   MUSHROOM KINGDOM GRAND PRIX
   A top-down kart racer with full lap track
   ============================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ---------- CHARACTERS ---------- */
// Stats: top speed, acceleration, handling
const CHARS = [
  { id:'mario',   name:'MARIO',   color:'#e52521', cap:'#e52521', skin:'#f9c890', overall:'#3a55c0', speed:7.2, accel:.10, handle:.055, emoji:'🍄'},
  { id:'luigi',   name:'LUIGI',   color:'#43b047', cap:'#43b047', skin:'#f9c890', overall:'#3a55c0', speed:7.0, accel:.11, handle:.060, emoji:'🌟'},
  { id:'peach',   name:'PEACH',   color:'#ff8fbf', cap:'#ffd83a', skin:'#fbe2c4', overall:'#ff8fbf', speed:7.4, accel:.09, handle:.058, emoji:'👑'},
  { id:'toad',    name:'TOAD',    color:'#ffffff', cap:'#e52521', skin:'#fbe2c4', overall:'#1d6fdc', speed:6.8, accel:.13, handle:.068, emoji:'🍄'},
  { id:'bowser',  name:'BOWSER',  color:'#1f8a2e', cap:'#ffd83a', skin:'#f6c244', overall:'#a23a14', speed:7.8, accel:.07, handle:.045, emoji:'🔥'},
  { id:'yoshi',   name:'YOSHI',   color:'#52d152', cap:'#52d152', skin:'#52d152', overall:'#ffffff', speed:7.1, accel:.12, handle:.062, emoji:'🥚'},
  { id:'donkey',  name:'D.KONG',  color:'#7a4a1f', cap:'#a83a14', skin:'#a87148', overall:'#a83a14', speed:7.5, accel:.08, handle:.048, emoji:'🍌'},
  { id:'kamek',   name:'KAMEK',   color:'#3a2e8a', cap:'#3a2e8a', skin:'#f9c890', overall:'#5a4ec0', speed:6.9, accel:.12, handle:.064, emoji:'✨'},
];

let selectedChar = CHARS[0];

/* ---------- CHARACTER SPRITES (canvas-drawn) ---------- */
function drawCharSprite(g, c, x, y, size, angle=0){
  // size = total height in px
  g.save();
  g.translate(x,y);
  g.rotate(angle);
  const s = size/16; // pixel unit
  // Kart base (under character)
  g.fillStyle = '#222';
  g.fillRect(-7*s, 3*s, 14*s, 5*s); // chassis
  g.fillStyle = c.color;
  g.fillRect(-6*s, 3*s, 12*s, 3*s); // colored hood
  // wheels
  g.fillStyle = '#111';
  g.fillRect(-8*s, 4*s, 2*s, 4*s);
  g.fillRect(6*s, 4*s, 2*s, 4*s);
  g.fillRect(-8*s, -1*s, 2*s, 3*s);
  g.fillRect(6*s, -1*s, 2*s, 3*s);
  // body / overalls
  g.fillStyle = c.overall;
  g.fillRect(-4*s, -2*s, 8*s, 6*s);
  // head
  g.fillStyle = c.skin;
  g.fillRect(-3*s, -7*s, 6*s, 5*s);
  // cap
  g.fillStyle = c.cap;
  g.fillRect(-4*s, -9*s, 8*s, 3*s);
  g.fillRect(-3*s, -7*s, 6*s, 1*s);
  // eyes
  g.fillStyle = '#fff';
  g.fillRect(-2*s, -5*s, 1.5*s, 1.5*s);
  g.fillRect(1*s, -5*s, 1.5*s, 1.5*s);
  g.fillStyle = '#000';
  g.fillRect(-1.5*s, -4.5*s, 1*s, 1*s);
  g.fillRect(1.5*s, -4.5*s, 1*s, 1*s);
  // little M / initial on cap (for Mario style)
  if(c.id==='mario' || c.id==='luigi'){
    g.fillStyle = '#fff';
    g.fillRect(-1*s, -8.5*s, 2*s, 1.5*s);
  }
  if(c.id==='peach'){
    // crown gem
    g.fillStyle = '#e52521';
    g.fillRect(-1*s, -10*s, 2*s, 1.5*s);
  }
  if(c.id==='bowser'){
    // horns
    g.fillStyle = '#fff';
    g.fillRect(-4.5*s, -10*s, 1.5*s, 1.5*s);
    g.fillRect(3*s, -10*s, 1.5*s, 1.5*s);
  }
  if(c.id==='yoshi'){
    // nose
    g.fillStyle = '#52d152';
    g.fillRect(-1*s, -3*s, 2*s, 1.5*s);
  }
  g.restore();
}

/* ---------- TRACK DEFINITION ----------
   Defined by a centerline of waypoints and a road half-width.
   The track is a closed loop, drawn into an offscreen canvas once.
*/
const ROAD_W = 70; // half-width
const WP = []; // waypoints (centerline)

// Build a fun curvy loop
function buildTrack(){
  WP.length = 0;
  // Start/Finish at bottom center, going up
  // Counter-clockwise loop
  const cx = W/2, cy = H/2;
  // Define key points
  const pts = [
    [W/2, H-130],         // start (going up on the right side)
    [W-180, H-130],       // bottom-right
    [W-130, H-260],       // up the right
    [W-130, 380],
    [W-200, 240],
    [W-380, 170],         // top-right curve
    [W/2+40, 130],
    [W/2-60, 200],        // top dip
    [220, 150],           // top-left
    [120, 280],
    [150, 460],           // left side
    [260, 580],
    [180, 720],           // bottom-left curve
    [320, 820],
    [W/2-40, 820],        // approach to finish
    [W/2-40, H-130],      // before finish line (left lane)
  ];
  // Smooth via Catmull-Rom interpolation
  const N = pts.length;
  const samplesPer = 24;
  for(let i=0;i<N;i++){
    const p0 = pts[(i-1+N)%N];
    const p1 = pts[i];
    const p2 = pts[(i+1)%N];
    const p3 = pts[(i+2)%N];
    for(let t=0;t<samplesPer;t++){
      const u = t/samplesPer;
      const u2 = u*u, u3 = u2*u;
      const x = 0.5*((2*p1[0]) + (-p0[0]+p2[0])*u + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3);
      const y = 0.5*((2*p1[1]) + (-p0[1]+p2[1])*u + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3);
      WP.push({x,y});
    }
  }
}

// Offscreen track render
let trackCanvas = null;
let trackMask = null; // ImageData alpha map indicating road
function renderTrack(){
  const tc = document.createElement('canvas');
  tc.width = W; tc.height = H;
  const g = tc.getContext('2d');

  // Grass background with texture
  g.fillStyle = '#4ec24e';
  g.fillRect(0,0,W,H);
  // grass tufts
  g.fillStyle = '#3aa83a';
  for(let i=0;i<400;i++){
    const x = Math.random()*W, y=Math.random()*H;
    g.fillRect(x,y,3,2);
  }
  // checker pattern strip on far edges for ambiance
  for(let i=0;i<W;i+=20){
    g.fillStyle = (i/20)%2===0 ? '#3aa83a' : '#4ec24e';
    g.fillRect(i,0,20,4);
    g.fillRect(i,H-4,20,4);
  }

  // Draw road: thick stroke through waypoints
  g.strokeStyle = '#5a5a6e';
  g.lineWidth = ROAD_W*2;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(WP[0].x, WP[0].y);
  for(let i=1;i<WP.length;i++) g.lineTo(WP[i].x, WP[i].y);
  g.closePath();
  g.stroke();

  // Road edge (yellow stripe)
  g.strokeStyle = '#ffd23f';
  g.lineWidth = ROAD_W*2 + 6;
  g.globalCompositeOperation = 'destination-over';
  g.beginPath();
  g.moveTo(WP[0].x, WP[0].y);
  for(let i=1;i<WP.length;i++) g.lineTo(WP[i].x, WP[i].y);
  g.closePath();
  g.stroke();
  g.globalCompositeOperation = 'source-over';

  // Road dashed center line
  g.strokeStyle = 'rgba(255,255,255,.55)';
  g.lineWidth = 3;
  g.setLineDash([14,14]);
  g.beginPath();
  g.moveTo(WP[0].x, WP[0].y);
  for(let i=1;i<WP.length;i++) g.lineTo(WP[i].x, WP[i].y);
  g.closePath();
  g.stroke();
  g.setLineDash([]);

  // Start/finish line - checkered
  const sf = WP[0];
  const next = WP[1];
  const ang = Math.atan2(next.y - sf.y, next.x - sf.x) + Math.PI/2;
  g.save();
  g.translate(sf.x, sf.y);
  g.rotate(ang);
  const checks = 8, ch = ROAD_W*2/checks;
  for(let i=0;i<checks;i++){
    for(let j=0;j<2;j++){
      g.fillStyle = ((i+j)%2===0) ? '#fff' : '#000';
      g.fillRect(-ROAD_W + i*ch, -10 + j*10, ch, 10);
    }
  }
  // banner posts
  g.fillStyle = '#e52521';
  g.fillRect(-ROAD_W-8, -34, 8, 60);
  g.fillRect(ROAD_W, -34, 8, 60);
  g.fillStyle = '#fff';
  g.fillRect(-ROAD_W-8, -34, ROAD_W*2+16, 8);
  g.fillStyle = '#000';
  g.font = 'bold 11px monospace';
  g.textAlign='center';
  g.fillText('FINISH', 0, -28);
  g.restore();

  // Decorations along the track sides: pipes, coins, question blocks, bushes
  const decos = [
    {x:90, y:90, type:'pipe'},
    {x:W-110, y:80, type:'block'},
    {x:W-60, y:H/2, type:'pipe'},
    {x:50, y:H-200, type:'block'},
    {x:W/2, y:50, type:'bush'},
    {x:W/2-100, y:H-50, type:'bush'},
    {x:W/2+150, y:H-60, type:'bush'},
    {x:60, y:H/2-100, type:'bush'},
    {x:W-50, y:H-50, type:'pipe'},
    {x:30, y:50, type:'cloud'},
    {x:W-100, y:H-300, type:'cloud'},
    {x:380, y:H/2, type:'block'},
    {x:520, y:H/2-60, type:'block'},
    {x:450, y:H/2+30, type:'coin'},
  ];
  for(const d of decos) drawDeco(g, d.x, d.y, d.type);

  trackCanvas = tc;

  // Build a road mask for surface detection (cheap: re-stroke onto alpha map)
  const mc = document.createElement('canvas');
  mc.width = W; mc.height = H;
  const mg = mc.getContext('2d');
  mg.strokeStyle = '#fff';
  mg.lineWidth = ROAD_W*2;
  mg.lineCap = 'round';
  mg.lineJoin = 'round';
  mg.beginPath();
  mg.moveTo(WP[0].x, WP[0].y);
  for(let i=1;i<WP.length;i++) mg.lineTo(WP[i].x, WP[i].y);
  mg.closePath();
  mg.stroke();
  trackMask = mg.getImageData(0,0,W,H);
}

function drawDeco(g, x, y, type){
  if(type==='pipe'){
    g.fillStyle = '#2bb24c';
    g.fillRect(x-14, y-10, 28, 30);
    g.fillRect(x-18, y-14, 36, 8);
    g.fillStyle = '#1f8a2e';
    g.fillRect(x-14, y-10, 4, 30);
    g.fillRect(x-18, y-14, 4, 8);
    g.fillStyle = '#5fe070';
    g.fillRect(x+8, y-10, 3, 30);
    g.fillRect(x+10, y-14, 3, 8);
    g.strokeStyle='#000';g.lineWidth=2;
    g.strokeRect(x-14, y-10, 28, 30);
    g.strokeRect(x-18, y-14, 36, 8);
  } else if(type==='block'){
    g.fillStyle = '#fbd000';
    g.fillRect(x-12, y-12, 24, 24);
    g.strokeStyle='#000';g.lineWidth=2;
    g.strokeRect(x-12, y-12, 24, 24);
    g.fillStyle = '#000';
    g.font = 'bold 16px monospace';
    g.textAlign='center';
    g.fillText('?', x, y+5);
    // bolts
    g.fillStyle='#b07c00';
    g.fillRect(x-10,y-10,2,2);
    g.fillRect(x+8,y-10,2,2);
    g.fillRect(x-10,y+8,2,2);
    g.fillRect(x+8,y+8,2,2);
  } else if(type==='bush'){
    g.fillStyle = '#1f8a2e';
    g.beginPath();
    g.arc(x-10,y,10,0,Math.PI*2);
    g.arc(x,y-4,12,0,Math.PI*2);
    g.arc(x+10,y,10,0,Math.PI*2);
    g.fill();
    g.fillStyle = '#3aa83a';
    g.beginPath();
    g.arc(x-6,y-3,4,0,Math.PI*2);
    g.arc(x+4,y-5,4,0,Math.PI*2);
    g.fill();
  } else if(type==='cloud'){
    g.fillStyle = '#fff';
    g.beginPath();
    g.arc(x-8,y,8,0,Math.PI*2);
    g.arc(x,y-2,10,0,Math.PI*2);
    g.arc(x+8,y,8,0,Math.PI*2);
    g.fill();
  } else if(type==='coin'){
    g.fillStyle = '#fbd000';
    g.beginPath();
    g.arc(x,y,8,0,Math.PI*2);
    g.fill();
    g.strokeStyle='#b07c00';g.lineWidth=2;g.stroke();
    g.fillStyle='#b07c00';
    g.font='bold 11px monospace';g.textAlign='center';
    g.fillText('$',x,y+4);
  }
}

/* ---------- SURFACE CHECK ---------- */
function isOnRoad(x,y){
  if(x<0||y<0||x>=W||y>=H) return false;
  const i = (Math.floor(y)*W + Math.floor(x))*4 + 3;
  return trackMask.data[i] > 10;
}

/* ---------- KART / RACER ---------- */
class Kart {
  constructor(char, isPlayer, startOffset=0){
    this.char = char;
    this.isPlayer = isPlayer;
    this.x = WP[0].x;
    this.y = WP[0].y;
    this.angle = Math.atan2(WP[1].y-WP[0].y, WP[1].x-WP[0].x);
    // offset perpendicular for starting grid
    const px = Math.cos(this.angle + Math.PI/2);
    const py = Math.sin(this.angle + Math.PI/2);
    this.x += px * (startOffset%2===0 ? -22 : 22);
    this.y += py * (startOffset%2===0 ? -22 : 22);
    this.x -= Math.cos(this.angle) * Math.floor(startOffset/2)*42;
    this.y -= Math.sin(this.angle) * Math.floor(startOffset/2)*42;

    this.vx = 0;
    this.vy = 0;
    this.speed = 0;
    this.lap = 0;
    this.checkpoint = 0; // index into WP
    this.finished = false;
    this.finishTime = 0;
    this.totalCheckpoints = WP.length;
    this.lastSpark = 0;
  }
  update(dt, input){
    const c = this.char;
    const onRoad = isOnRoad(this.x, this.y);
    const friction = onRoad ? 0.985 : 0.92;
    const grip = onRoad ? 1.0 : 0.55;
    const maxSpeed = c.speed * (onRoad ? 1 : 0.5);
    const accel = c.accel * grip;

    if(input.up) this.speed += accel;
    if(input.down) this.speed -= accel*0.8;
    this.speed *= friction;
    this.speed = Math.max(-3, Math.min(maxSpeed, this.speed));

    // steering — scaled by speed so kart only turns while moving
    const steerAmt = c.handle * Math.sign(this.speed) * Math.min(1, Math.abs(this.speed)/3);
    if(input.left)  this.angle -= steerAmt;
    if(input.right) this.angle += steerAmt;

    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.x += this.vx;
    this.y += this.vy;

    // bounce-back at canvas edge
    if(this.x<10){this.x=10;this.speed*=0.5;}
    if(this.y<10){this.y=10;this.speed*=0.5;}
    if(this.x>W-10){this.x=W-10;this.speed*=0.5;}
    if(this.y>H-10){this.y=H-10;this.speed*=0.5;}

    // checkpoint / lap advancement
    // find closest waypoint, but only advance forward
    const lookAhead = 30; // how many waypoints ahead we'll check
    let bestIdx = this.checkpoint;
    let bestDist = Infinity;
    for(let k=0;k<lookAhead;k++){
      const idx = (this.checkpoint + k) % WP.length;
      const dx = WP[idx].x - this.x;
      const dy = WP[idx].y - this.y;
      const d = dx*dx + dy*dy;
      if(d < 1800 && d < bestDist){
        bestDist = d;
        bestIdx = idx;
      }
    }
    if(bestIdx !== this.checkpoint){
      // detect lap rollover (crossing index 0 from high index)
      if(bestIdx < this.checkpoint - WP.length/2){
        // we wrapped past 0 → completed a lap
        this.lap++;
        if(this.isPlayer && this.lap < TOTAL_LAPS){
          showBanner('LAP ' + (this.lap+1) + '!', 1200);
        }
        if(this.lap >= TOTAL_LAPS){
          this.finished = true;
          this.finishTime = raceTime;
        }
      }
      this.checkpoint = bestIdx;
    }
  }
  draw(g){
    // shadow
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.beginPath();
    g.ellipse(this.x+3, this.y+5, 18, 8, 0, 0, Math.PI*2);
    g.fill();
    // sprite (kart auto-rotates with angle)
    drawCharSprite(g, this.char, this.x, this.y, 36, this.angle + Math.PI/2);

    // motion dust on grass
    if(!isOnRoad(this.x,this.y) && Math.abs(this.speed) > 1.5){
      g.fillStyle='rgba(255,255,255,.6)';
      g.beginPath();
      g.arc(this.x - Math.cos(this.angle)*14 + (Math.random()-.5)*8,
            this.y - Math.sin(this.angle)*14 + (Math.random()-.5)*8,
            2 + Math.random()*2, 0, Math.PI*2);
      g.fill();
    }
  }
}

/* ---------- AI ---------- */
function aiInput(k){
  // Aim at a waypoint several ahead
  const targetIdx = (k.checkpoint + 8) % WP.length;
  const tx = WP[targetIdx].x, ty = WP[targetIdx].y;
  const dx = tx - k.x, dy = ty - k.y;
  const desired = Math.atan2(dy, dx);
  let diff = desired - k.angle;
  while(diff > Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  return {
    up: true,
    down: Math.abs(diff) > 1.3 && k.speed > k.char.speed*0.7,
    left: diff < -0.05,
    right: diff > 0.05,
  };
}

/* ---------- GAME STATE ---------- */
const TOTAL_LAPS = 3;
let karts = [];
let player = null;
let raceTime = 0;
let raceStarted = false;
let raceState = 'menu'; // menu | countdown | racing | finished
let countdownT = 0;

const input = {up:false,down:false,left:false,right:false};

/* ---------- CAMERA ----------
   We draw the world to canvas with a slight camera offset toward player.
   For simplicity we keep the whole track visible (no zoom) — this makes
   the game readable as a top-down kart racer.
*/

/* ---------- INIT ---------- */
buildTrack();
renderTrack();

function setupCharGrid(){
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  CHARS.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'char' + (c.id===selectedChar.id ? ' selected' : '');
    el.dataset.id = c.id;
    // mini canvas sprite
    const cnv = document.createElement('canvas');
    cnv.width = 64; cnv.height = 64;
    cnv.className = 'sprite';
    const g = cnv.getContext('2d');
    g.imageSmoothingEnabled = false;
    drawCharSprite(g, c, 32, 38, 50, 0);
    el.appendChild(cnv);
    const nm = document.createElement('div');
    nm.className='name'; nm.textContent = c.name;
    el.appendChild(nm);
    const st = document.createElement('div');
    st.className='stats';
    st.innerHTML = `SPD ${'★'.repeat(Math.round(c.speed-5))}<br>ACC ${'★'.repeat(Math.round(c.accel*40))}<br>HND ${'★'.repeat(Math.round(c.handle*70))}`;
    el.appendChild(st);
    el.addEventListener('click', ()=>{
      selectedChar = c;
      document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    });
    grid.appendChild(el);
  });
}
setupCharGrid();

function startRace(){
  document.getElementById('selectScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  // Build kart lineup: player + 3 other random characters
  const others = CHARS.filter(c=>c.id!==selectedChar.id);
  // shuffle and pick 3
  for(let i=others.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [others[i],others[j]]=[others[j],others[i]];
  }
  const opponents = others.slice(0,3);
  karts = [];
  player = new Kart(selectedChar, true, 0);
  karts.push(player);
  for(let i=0;i<opponents.length;i++){
    karts.push(new Kart(opponents[i], false, i+1));
  }
  raceTime = 0;
  raceState = 'countdown';
  countdownT = 0;
  raceStarted = false;
}

document.getElementById('startBtn').addEventListener('click', startRace);
document.getElementById('againBtn').addEventListener('click', ()=>{
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('selectScreen').classList.remove('hidden');
});

/* ---------- INPUT ---------- */
const keyMap = {
  'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
  'w':'up','s':'down','a':'left','d':'right',
  'W':'up','S':'down','A':'left','D':'right',
};
window.addEventListener('keydown', e=>{
  if(keyMap[e.key]){ input[keyMap[e.key]]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  if(keyMap[e.key]){ input[keyMap[e.key]]=false; e.preventDefault(); }
});
// touch buttons
document.querySelectorAll('.tbtn').forEach(b=>{
  const k = b.dataset.key;
  const action = keyMap[k];
  const on = e=>{e.preventDefault(); input[action]=true;};
  const off = e=>{e.preventDefault(); input[action]=false;};
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', off);
});

/* ---------- BANNER ---------- */
function showBanner(text, duration=1500){
  const b = document.getElementById('finishBanner');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(b._t);
  b._t = setTimeout(()=>b.classList.remove('show'), duration);
}

/* ---------- COUNTDOWN ---------- */
function doCountdown(dt){
  countdownT += dt;
  const t = countdownT;
  const el = document.getElementById('countdown');
  let label = '';
  if(t < 1)     label = '3';
  else if(t < 2)label = '2';
  else if(t < 3)label = '1';
  else if(t < 4){label = 'GO!'; raceStarted = true;}
  else { el.classList.remove('show'); el.textContent=''; raceState='racing'; return;}
  if(el.textContent !== label){
    el.textContent = label;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }
}

/* ---------- COMPUTE STANDINGS ---------- */
function getStandings(){
  // sort by lap+progress (progress = checkpoint index / WP.length)
  const arr = karts.map(k=>({
    k,
    score: k.lap + (k.checkpoint / WP.length),
    finished: k.finished,
    time: k.finishTime,
  }));
  arr.sort((a,b)=>{
    if(a.finished && b.finished) return a.time - b.time;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.score - a.score;
  });
  return arr;
}

/* ---------- MAIN LOOP ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;

  // draw track
  ctx.drawImage(trackCanvas, 0, 0);

  if(raceState === 'countdown'){
    doCountdown(dt);
    // draw karts standing still
    for(const k of karts) k.draw(ctx);
  } else if(raceState === 'racing'){
    raceTime += dt;
    // player input
    player.update(dt, input);
    for(const k of karts){
      if(k===player) continue;
      const ai = aiInput(k);
      k.update(dt, ai);
    }
    // draw in y-order so closer karts render on top
    const sorted = [...karts].sort((a,b)=>a.y-b.y);
    for(const k of sorted) k.draw(ctx);

    // HUD
    document.getElementById('lap').textContent = Math.min(player.lap+1, TOTAL_LAPS) + '/' + TOTAL_LAPS;
    document.getElementById('time').textContent = raceTime.toFixed(2);
    document.getElementById('speedo').textContent = Math.abs(Math.round(player.speed*20));
    const standings = getStandings();
    const pIdx = standings.findIndex(s=>s.k===player);
    document.getElementById('pos').textContent = (pIdx+1)+'/'+karts.length;

    // check finish
    if(player.finished){
      raceState = 'finished';
      setTimeout(()=>showResults(), 900);
      showBanner('FINISH!', 2000);
    }
  } else if(raceState === 'finished'){
    // keep AIs going briefly so leaderboard fills in
    for(const k of karts){
      if(k.finished) continue;
      const ai = aiInput(k);
      k.update(dt, ai);
    }
    const sorted = [...karts].sort((a,b)=>a.y-b.y);
    for(const k of sorted) k.draw(ctx);
  } else {
    // menu — draw a still scene with karts at the line
    if(karts.length === 0){
      // preview: draw selected char at start line
      const ang = Math.atan2(WP[1].y-WP[0].y, WP[1].x-WP[0].x);
      drawCharSprite(ctx, selectedChar, WP[0].x, WP[0].y, 36, ang + Math.PI/2);
    } else {
      for(const k of karts) k.draw(ctx);
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showResults(){
  const standings = getStandings();
  // ensure unfinished karts get a fallback time
  standings.forEach(s=>{
    if(!s.finished) s.time = raceTime + (1 - s.score/TOTAL_LAPS)*30;
  });
  const pIdx = standings.findIndex(s=>s.k===player);
  const place = pIdx+1;
  const suffix = ['st','nd','rd','th'][Math.min(place-1,3)];
  document.getElementById('resultTitle').textContent =
    place===1 ? 'YOU WIN!' : `${place}${suffix} PLACE`;
  document.getElementById('resultSub').textContent =
    `Your time: ${player.finishTime.toFixed(2)}s`;
  const div = document.getElementById('standings');
  div.innerHTML = standings.map((s,i)=>{
    const star = s.k===player ? ' ◀' : '';
    const medal = ['🥇','🥈','🥉','  '][i] || '  ';
    return `${medal} ${(i+1)}. ${s.k.char.name.padEnd(7)} ${s.time.toFixed(2)}s${star}`;
  }).join('<br>');
  document.getElementById('resultScreen').classList.remove('hidden');
}
</script>
