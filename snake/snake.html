<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snake</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102418;color:white;font-family:Arial,sans-serif}main{text-align:center;width:min(92vw,520px)}canvas{width:100%;max-width:420px;background:#07130d;border:4px solid #75df75;border-radius:16px}button,a{background:#75df75;color:#07130d;border:0;border-radius:999px;padding:10px 16px;font-weight:bold;text-decoration:none;cursor:pointer}.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.pad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;justify-content:center;margin-top:16px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}</style></head><body><main><h1>Snake</h1><div class="bar"><a href="../index.html">Back</a><strong>Score: <span id="score">0</span></strong><button id="restart">Restart</button></div><canvas id="board" width="420" height="420"></canvas><p>Use arrow keys, WASD, or the buttons.</p><div class="pad"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div></main><script>const c=document.getElementById('board'),x=c.getContext('2d'),s=document.getElementById('score');const cells=21,size=20;let snake,apple,dir,next,score,timer;function reset(){snake=[{x:10,y:10}];apple={x:15,y:10};dir={x:1,y:0};next=dir;score=0;s.textContent=0;clearInterval(timer);timer=setInterval(tick,120);draw()}function turn(n){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(m&&(m.x+dir.x||m.y+dir.y))next=m}function tick(){dir=next;const h=snake[0],n={x:h.x+dir.x,y:h.y+dir.y};if(n.x<0||n.y<0||n.x>=cells||n.y>=cells||snake.some(p=>p.x===n.x&&p.y===n.y)){over();return}snake.unshift(n);if(n.x===apple.x&&n.y===apple.y){score++;s.textContent=score;place()}else snake.pop();draw()}function place(){do{apple={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(p=>p.x===apple.x&&p.y===apple.y))}function draw(){x.fillStyle='#07130d';x.fillRect(0,0,420,420);x.fillStyle='#ff5555';x.fillRect(apple.x*size+3,apple.y*size+3,14,14);snake.forEach((p,i)=>{x.fillStyle=i?'#75df75':'#d8ffd8';x.fillRect(p.x*size+2,p.y*size+2,16,16)})}function over(){clearInterval(timer);draw();x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,420,420);x.fillStyle='white';x.font='bold 38px Arial';x.textAlign='center';x.fillText('Game Over',210,205);x.font='18px Arial';x.fillText('Press Restart',210,238)}document.addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(k){e.preventDefault();turn(k)}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));document.getElementById('restart').onclick=reset;reset()</script></body></html>
